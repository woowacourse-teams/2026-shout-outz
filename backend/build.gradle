plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.1'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'com.epages.restdocs-api-spec' version '0.20.1'
}

group = 'com.shoutoutz'
version = '0.0.1-SNAPSHOT'
description = 'Shout-outz API'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.apache.httpcomponents.client5:httpclient5'
    implementation 'org.jsoup:jsoup:1.23.2'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'

    implementation platform('software.amazon.awssdk:bom:2.54.7')
    implementation 'software.amazon.awssdk:s3'
    implementation 'software.amazon.awssdk:sqs'

    // Java ImageIO에서 WebP를 읽고 쓰기 위한 ARM/x86 지원 SPI 플러그인
    implementation 'com.github.usefulness:webp-imageio:0.11.0'

    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-database-postgresql'

    runtimeOnly 'org.postgresql:postgresql'
    // CloudWatch Agent가 수집할 수 있도록 Actuator 지표를 Prometheus 형식으로 노출
    runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
    // 부하 테스트에서 느린 쿼리를 찾기 위해 JPA·JdbcTemplate 쿼리의 실행 시간을 잰다 (slow-query-log.enabled일 때만 사용)
    implementation 'net.ttddyy:datasource-proxy:1.11.0'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1' //OAS로 변경 해주는 라이브러리. restassured가 아닌 mockmvc를 기반으로 한다.
    testImplementation 'io.rest-assured:rest-assured:6.0.1'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add('-parameters')
    options.encoding = 'UTF-8'
}

tasks.named('test') {
    useJUnitPlatform()
}

/**
 * ePages Gradle 플러그인의 openapi3 task 설정 블록
 */
openapi3 {
    server = 'http://localhost:8080'
    title = 'Shout-outz API'
    description = 'Shout-outz Backend API'
    version = project.version
    format = 'yaml'
    separatePublicApi = true
}

// restdocs-api-spec 0.20.1은 INTEGER 경로 파라미터를 int32로 생성하므로 인터뷰의 long ID를 보정한다.
tasks.matching { it.name == 'openapi3' }.configureEach {
    doLast {
        ['openapi3.yaml', 'openapi3-public.yaml'].each { name ->
            def document = layout.buildDirectory.file("api-spec/${name}").get().asFile
            def specification = io.swagger.v3.core.util.Yaml.mapper()
                    .readValue(document, io.swagger.v3.oas.models.OpenAPI)
            specification.paths.findAll { path, item -> path.contains('/interviews/') }
                    .values().each { item ->
                item.readOperations().each { operation ->
                    operation.parameters?.findAll { parameter ->
                        parameter.in == 'path' && parameter.name in ['interviewId', 'commentId']
                    }?.each { parameter -> parameter.schema.format = 'int64' }
                }
            }
            document.setText(io.swagger.v3.core.util.Yaml.pretty().writeValueAsString(specification), 'UTF-8')
        }
    }
}

/**
 * OpenAPI yaml 파일(OAS 스펙)을 Swagger UI가 읽을 수 있도록 정적 리소스 위치로 복사
 */
tasks.register('copyOasToSwagger', Copy) {
    dependsOn tasks.named('openapi3')

    from(layout.buildDirectory.file('api-spec/openapi3-public.yaml')) {
        rename { 'openapi3.yaml' }
    }
    into(layout.projectDirectory.dir('src/main/resources/static/docs'))
}

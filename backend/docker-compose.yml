services:
  db:
    image: pgvector/pgvector:pg17-trixie
    container_name: shoutoutz-db
    environment:
      POSTGRES_DB: shoutoutz
      POSTGRES_USER: shoutoutz
      POSTGRES_PASSWORD: localdev
      TZ: Asia/Seoul
      PGTZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - shoutoutz-db-data:/var/lib/postgresql/data

volumes:
  shoutoutz-db-data:

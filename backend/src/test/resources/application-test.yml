spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/shoutoutz
    username: shoutoutz
    password: localdev
    driver-class-name: org.postgresql.Driver

link-preview:
  enabled: false

question-recommendation:
  count: 5
  max-generation-attempts: 5
  max-outbox-attempts: 5
  outbox-poll-interval-millis: 5000
  outbox-initial-delay-millis: 1000
  fallback-enabled: true
  sqs:
    enabled: false
    queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-question-recommendations
    dead-letter-queue-url: https://sqs.ap-northeast-2.amazonaws.com/000000000000/test-question-recommendations-dlq
    region: ap-northeast-2
    poll-interval-millis: 1000
    max-messages-per-poll: 1
    visibility-timeout: 3m

llm:
  gemini:
    api-key: test-gemini-api-key
    model: gemini-3.8-flash
    connect-timeout: 5s
    read-timeout: 45s
  openai:
    api-key: test-openai-api-key
    model: gpt-6-luna
    connect-timeout: 5s
    read-timeout: 45s

github:
  oauth:
    client-id: test-client-id
    client-secret: test-client-secret
    redirect-uri: http://localhost:8080/login/oauth2/code/github

auth:
  oauth:
    completion-uri: http://localhost:3000/oauth/callback

aws:
  s3:
    bucket: test-bucket
    region: test-region
    key-prefix: test-prefix/
    presigned-url-expiration-seconds: 100
  cloudfront:
    public-base-url: https://cdn.example.com/

visitor:
  hash-secret: test-visitor-hash-secret-32-chars-min

openapi: 3.0.1
info:
  title: Shout-outz API
  description: Shout-outz Backend API
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/visitors:
    post:
      tags:
      - Visitor
      summary: 방문자 생성
      description: 방문자를 생성한다.
      operationId: visitor-create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/VisitorSaveRequest"
            examples:
              visitor-create:
                value: |
                  {
                    "example": "example"
                  }
              visitor-create-invalid:
                value: |
                  {
                    "example": ""
                  }
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponseVisitorSaveResponse"
              examples:
                visitor-create:
                  value: "{\"status\":\"success\",\"data\":{\"id\":1,\"example\":\"\
                    example\"}}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/api-v1-visitors-33084672"
              examples:
                visitor-create-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"example\"\
                    ,\"message\":\"example은 필수입니다.\"}]}"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 현재 인증 세션을 무효화한다. CSRF Token이 유효하지 않으면 403 CSRF_TOKEN_INVALID를 반환한다.
      operationId: auth-logout
      parameters:
      - name: Cookie
        in: header
        description: 인증된 사용자의 JSESSIONID
        required: true
        schema:
          type: string
        example: JSESSIONID=session-id
      - name: X-CSRF-Token
        in: header
        description: 세션 조회 API에서 발급받은 CSRF Token
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "204":
          description: "204"
  /api/v1/auth/session:
    get:
      tags:
      - Auth
      summary: 인증 세션 조회
      description: 현재 로그인 상태와 상태 변경 요청에 사용할 CSRF Token을 조회한다.
      operationId: auth-session-get
      parameters:
      - name: Cookie
        in: header
        description: 기존 세션이 있을 때 브라우저가 전송하는 JSESSIONID
        required: false
        schema:
          type: string
        example: JSESSIONID=session-id
      responses:
        "200":
          description: "200"
          headers:
            Cache-Control:
              description: 인증 정보와 CSRF Token의 캐시 저장 방지
              schema:
                type: string
            Set-Cookie:
              description: 새 세션을 생성한 경우 발급되는 JSESSIONID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponseAuthSessionResponse"
              examples:
                auth-session-get:
                  value: "{\"status\":\"success\",\"data\":{\"status\":\"AUTHENTICATED\"\
                    ,\"userId\":1,\"role\":\"USER\",\"csrfToken\":\"csrf-token\"}}"
  /api/v1/auth/signup:
    post:
      tags:
      - Auth
      summary: OAuth 사용자 가입
      description: "가입 대기 OAuth 신원에 서비스 사용자와 프로필을 생성하고 인증 세션을 설정한다. 가입 정보가 유효하지 않으\
        면 400 VALIDATION_FAILED, 가입 대기 신원이 없으면 400 OAUTH_SIGNUP_SESSION_NOT_FOUND,\
        \ CSRF Token이 유효하지 않으면 403 CSRF_TOKEN_INVALID를 반환한다."
      operationId: auth-signup
      parameters:
      - name: Cookie
        in: header
        description: 가입 대기 신원이 저장된 JSESSIONID
        required: true
        schema:
          type: string
        example: JSESSIONID=expired-session-id
      - name: X-CSRF-Token
        in: header
        description: 세션 조회 API에서 발급받은 CSRF Token
        required: true
        schema:
          type: string
        example: csrf-token
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSignupRequest"
            examples:
              auth-signup-session-missing:
                value: |
                  {
                    "handle": "zzaekkii",
                    "displayName": "재키",
                    "userType": "GENERAL"
                  }
              auth-signup-invalid:
                value: |
                  {
                    "handle": "",
                    "displayName": "",
                    "userType": "GENERAL"
                  }
              auth-signup:
                value: |
                  {
                    "handle": "zzaekkii",
                    "displayName": "재키",
                    "userType": "WOOWACOURSE_CREW",
                    "track": "BACKEND",
                    "cohort": 8
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-signup-session-missing:
                  value: "{\"status\":\"error\",\"code\":\"OAUTH_SIGNUP_SESSION_NOT_FOUND\"\
                    ,\"message\":\"가입 대기 OAuth 신원을 찾을 수 없습니다.\"}"
                auth-signup-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"displayName\"\
                    ,\"message\":\"displayName은 필수입니다.\"},{\"field\":\"handle\",\"\
                    message\":\"handle은 필수입니다.\"}]}"
        "201":
          description: "201"
          headers:
            Set-Cookie:
              description: 가입 완료 후 인증 상태로 회전된 JSESSIONID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponseOAuthSignupResponse"
              examples:
                auth-signup:
                  value: "{\"status\":\"success\",\"data\":{\"userId\":1}}"
  /oauth2/authorization/github:
    get:
      tags:
      - Auth
      summary: GitHub 로그인 시작
      description: state와 PKCE 값을 생성해 세션에 저장하고 GitHub 인가 화면으로 이동한다.
      operationId: auth-github-authorization
      responses:
        "302":
          description: "302"
          headers:
            Location:
              description: GitHub OAuth 인가 화면 URI
              schema:
                type: string
            Set-Cookie:
              description: OAuth 로그인 시도를 저장한 JSESSIONID
              schema:
                type: string
components:
  schemas:
    ErrorResponse:
      title: ErrorResponse
      required:
      - code
      - message
      - status
      type: object
      properties:
        code:
          type: string
          description: 오류 식별자
        details:
          type: array
          description: 요청 필드별 오류
          items:
            required:
            - field
            - message
            type: object
            properties:
              field:
                type: string
                description: 오류가 발생한 요청 필드
              message:
                type: string
                description: 필드 오류 설명
        message:
          type: string
          description: 오류 설명
        status:
          type: string
          description: 오류 상태
    VisitorSaveRequest:
      title: VisitorSaveRequest
      required:
      - example
      type: object
      properties:
        example:
          type: string
          description: 방문자 예시 값
    SuccessResponseOAuthSignupResponse:
      title: SuccessResponseOAuthSignupResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - userId
          type: object
          properties:
            userId:
              type: number
              description: 생성된 사용자 ID
          description: 가입 결과
        status:
          type: string
          description: 응답 상태
    OAuthSignupRequest:
      title: OAuthSignupRequest
      required:
      - displayName
      - handle
      - userType
      type: object
      properties:
        displayName:
          type: string
          description: 프로필 표시 이름
        cohort:
          type: number
          description: 우테코 크루의 기수
          nullable: true
        handle:
          type: string
          description: 영구 공개 핸들
        userType:
          type: string
          description: "GENERAL, WOOWACOURSE_CREW, WOOWACOURSE_COACH"
        track:
          type: string
          description: 우테코 크루의 트랙
          nullable: true
    api-v1-visitors-33084672:
      type: object
    SuccessResponseAuthSessionResponse:
      title: SuccessResponseAuthSessionResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - csrfToken
          - status
          type: object
          properties:
            csrfToken:
              type: string
              description: 상태 변경 요청에 사용할 CSRF Token
            role:
              type: string
              description: 인증된 사용자 권한
              nullable: true
            userId:
              type: number
              description: 인증된 사용자 ID
              nullable: true
            status:
              type: string
              description: "UNAUTHENTICATED, SIGNUP_REQUIRED, AUTHENTICATED"
          description: 인증 세션 정보
        status:
          type: string
          description: 응답 상태
    SuccessResponseVisitorSaveResponse:
      title: SuccessResponseVisitorSaveResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - example
          - id
          type: object
          properties:
            id:
              type: number
              description: 방문자 ID
            example:
              type: string
              description: 방문자 예시 값
          description: 생성된 방문자 정보
        status:
          type: string
          description: 응답 상태

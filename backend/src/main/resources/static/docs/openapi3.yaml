                    ,\"userId\":1,\"role\":\"USER\",\"csrfToken\":\"csrf-token\"}}"
  /api/v1/auth/signup:
    post:
      tags:
      - Auth
      summary: OAuth 사용자 가입
      description: "가입 대기 OAuth 신원에 서비스 사용자와 프로필을 생성하고 인증 세션을 설정한다. 가입 정보가 유효하지 않으\
        면 400 VALIDATION_FAILED, 가입 대기 신원이 없으면 400 OAUTH_SIGNUP_SESSION_NOT_FOUND,\
        \ CSRF Token이 유효하지 않으면 403 CSRF_TOKEN_INVALID, handle이 중복되면 409 HANDLE_ALREADY_EXISTS를\
        \ 반환한다."
      operationId: auth-signup
      parameters:
      - name: Cookie
        in: header
        description: 가입 대기 신원이 저장된 JSESSIONID
        required: true
        schema:
          type: string
        example: JSESSIONID=expired-session-id
      - name: X-CSRF-Token
        in: header
        description: 세션 조회 API에서 발급받은 CSRF Token
        required: true
        schema:
          type: string
        example: csrf-token
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSignupRequest"
            examples:
              auth-signup-session-missing:
                value: |
                  {
                    "handle": "@zzaekkii",
                    "displayName": "재키"
                  }
              auth-signup-invalid:
                value: |
                  {
                    "handle": "",
                    "displayName": ""
                  }
              auth-signup-handle-conflict:
                value: |
                  {
                    "handle": "@zzaekkii",
                    "displayName": "재키"
                  }
              auth-signup:
                value: |
                  {
                    "handle": "@zzaekkii",
                    "displayName": "재키"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-signup-session-missing:
                  value: "{\"status\":\"error\",\"code\":\"OAUTH_SIGNUP_SESSION_NOT_FOUND\"\
                    ,\"message\":\"가입 대기 OAuth 신원을 찾을 수 없습니다.\"}"
                auth-signup-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"displayName\"\
                    ,\"message\":\"displayName은 필수입니다.\"},{\"field\":\"handle\",\"\
                    message\":\"handle은 필수입니다.\"},{\"field\":\"handle\",\"message\"\
                    :\"handle 형식이 올바르지 않습니다.\"}]}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-signup-handle-conflict:
                  value: "{\"status\":\"error\",\"code\":\"HANDLE_ALREADY_EXISTS\"\
                    ,\"message\":\"이미 사용 중인 handle입니다.\"}"
        "201":
          description: "201"
          headers:
            Set-Cookie:
              description: 가입 완료 후 인증 상태로 회전된 JSESSIONID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSignupSuccessResponse"
              examples:
                auth-signup:
                  value: "{\"status\":\"success\",\"data\":{\"userId\":1}}"

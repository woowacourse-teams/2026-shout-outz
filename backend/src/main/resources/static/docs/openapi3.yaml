  /api/v1/tech-tags:
    get:
      tags:
      - TechTag
      summary: 기술 스택 조회
      description: 선택 가능한 기술 스택을 displayName 오름차순으로 반환한다. keyword가 없거나 비어 있으면 전체를
        반환한다.
      operationId: tech-tag-find-all
      parameters:
      - name: keyword
        in: query
        description: displayName 또는 slug 부분 일치 검색어 (대소문자 무시)
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TechTagFindAllSuccessResponse"
              examples:
                tech-tag-find-all:
                  value: "{\"status\":\"success\",\"data\":{\"items\":[{\"id\":8,\"\
                    displayName\":\"Spring Boot\"}]}}"
  /api/v1/visitors:
    post:
      tags:
      - Visitor
      summary: 방문자 생성
      description: 방문자를 생성한다.
      operationId: visitor-create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/VisitorSaveRequest"
            examples:
              visitor-create:
                value: |
                  {
                    "example": "example"
                  }
              visitor-create-invalid:
                value: |
                  {
                    "example": ""
                  }
      responses:
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VisitorCreateSuccessResponse"
              examples:
                visitor-create:
                  value: "{\"status\":\"success\",\"data\":{\"id\":1,\"example\":\"\
                    example\"}}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                visitor-create-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"example\"\
                    ,\"message\":\"example은 필수입니다.\"}]}"
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: 로그아웃
      description: 현재 인증 세션을 무효화한다. CSRF Token이 유효하지 않으면 403 CSRF_TOKEN_INVALID를 반환한다.
      operationId: auth-logout
      parameters:
      - name: Cookie
        in: header
        description: 인증된 사용자의 JSESSIONID
        required: true
        schema:
          type: string
        example: JSESSIONID=session-id
      - name: X-CSRF-Token
        in: header
        description: 세션 조회 API에서 발급받은 CSRF Token
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-logout-csrf-invalid:
                  value: "{\"status\":\"error\",\"code\":\"CSRF_TOKEN_INVALID\",\"\
                    message\":\"CSRF Token이 유효하지 않습니다.\"}"
        "204":
          description: "204"
  /api/v1/auth/session:
    get:
      tags:
      - Auth
      summary: 인증 세션 조회
      description: 현재 로그인 상태와 상태 변경 요청에 사용할 CSRF Token을 조회한다.
      operationId: auth-session-get
      parameters:
      - name: Cookie
        in: header
        description: 기존 세션이 있을 때 브라우저가 전송하는 JSESSIONID
        required: false
        schema:
          type: string
        example: JSESSIONID=session-id
      responses:
        "200":
          description: "200"
          headers:
            Cache-Control:
              description: 인증 정보와 CSRF Token의 캐시 저장 방지
              schema:
                type: string
            Set-Cookie:
              description: 새 세션을 생성한 경우 발급되는 JSESSIONID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthSessionSuccessResponse"
              examples:
                auth-session-get:
                  value: "{\"status\":\"success\",\"data\":{\"status\":\"AUTHENTICATED\"\
                    ,\"userId\":1,\"role\":\"USER\",\"csrfToken\":\"csrf-token\"}}"
  /api/v1/auth/signup:
    post:
      tags:
      - Auth
      summary: OAuth 사용자 가입
      description: "가입 대기 OAuth 신원에 서비스 사용자와 프로필을 생성하고 인증 세션을 설정한다. 가입 정보가 유효하지 않으\
        면 400 VALIDATION_FAILED, 가입 대기 신원이 없으면 400 OAUTH_SIGNUP_SESSION_NOT_FOUND,\
        \ CSRF Token이 유효하지 않으면 403 CSRF_TOKEN_INVALID, handle이 중복되면 409 HANDLE_ALREADY_EXISTS를\
        \ 반환한다."
      operationId: auth-signup
      parameters:
      - name: Cookie
        in: header
        description: 가입 대기 신원이 저장된 JSESSIONID
        required: true
        schema:
          type: string
        example: JSESSIONID=expired-session-id
      - name: X-CSRF-Token
        in: header
        description: 세션 조회 API에서 발급받은 CSRF Token
        required: true
        schema:
          type: string
        example: csrf-token
      - name: Content-Type
        in: header
        description: application/json
        required: true
        schema:
          type: string
        example: application/json
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OAuthSignupRequest"
            examples:
              auth-signup-session-missing:
                value: |
                  {
                    "handle": "zzaekkii",
                    "displayName": "재키"
                  }
              auth-signup-invalid:
                value: |
                  {
                    "handle": "",
                    "displayName": ""
                  }
              auth-signup-handle-conflict:
                value: |
                  {
                    "handle": "zzaekkii",
                    "displayName": "재키"
                  }
              auth-signup:
                value: |
                  {
                    "handle": "zzaekkii",
                    "displayName": "재키"
                  }
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-signup-session-missing:
                  value: "{\"status\":\"error\",\"code\":\"OAUTH_SIGNUP_SESSION_NOT_FOUND\"\
                    ,\"message\":\"가입 대기 OAuth 신원을 찾을 수 없습니다.\"}"
                auth-signup-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"displayName\"\
                    ,\"message\":\"displayName은 필수입니다.\"},{\"field\":\"handle\",\"\
                    message\":\"handle은 필수입니다.\"},{\"field\":\"handle\",\"message\"\
                    :\"handle 형식이 올바르지 않습니다.\"}]}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                auth-signup-handle-conflict:
                  value: "{\"status\":\"error\",\"code\":\"HANDLE_ALREADY_EXISTS\"\
                    ,\"message\":\"이미 사용 중인 handle입니다.\"}"
        "201":
          description: "201"
          headers:
            Set-Cookie:
              description: 가입 완료 후 인증 상태로 회전된 JSESSIONID
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OAuthSignupSuccessResponse"
              examples:
                auth-signup:
                  value: "{\"status\":\"success\",\"data\":{\"userId\":1}}"

        한다. 로그인하지 않아도 조회할 수 있다. 승인된 프로젝트는 누구나, 승인되지 않은 프로젝트는 등록자만 조회할 수 있으며, 볼 수 없\
        는 프로젝트는 존재 여부를 숨기기 위해 없는 프로젝트와 같은 404를 반환한다. registeredBy가 null이면 이전 기수에서\
        \ 이관된 프로젝트다. 프로젝트 ID가 숫자가 아니면 400을 반환한다."
      operationId: project-find-detail
      parameters:
      - name: projectId
        in: path
        description: 조회할 프로젝트 ID

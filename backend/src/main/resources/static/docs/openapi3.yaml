  /api/v1/projects/@{slug}:
    get:
      tags:
      - Project
      summary: 프로젝트 상세 조회
      description: "프로젝트 상세 화면에 필요한 기본 정보, 상세 설명, 팀원, 기술 스택, 외부 링크, 리액션 및 댓글 수를 조회\
        한다. 로그인하지 않아도 조회할 수 있다. 승인된 프로젝트는 누구나, 승인되지 않은 프로젝트는 등록자만 조회할 수 있으며, 삭제된 프\
        로젝트는 등록자 본인만 조회할 수 있다. 볼 수 없는 프로젝트는 존재 여부를 숨기기 위해 없는 프로젝트와 같은 404를 반환한다. editable은\
        \ 요청자가 등록자 본인인지를 나타내며, 수정·삭제 버튼 노출에 쓴다. slug 형식에 맞지 않는 값도 없는 프로젝트와 같은 404를\
        \ 반환한다. 이후 수정·리액션·댓글 등은 응답의 id로 요청한다."
      operationId: project-find-detail
      parameters:
      - name: slug
        in: path
        description: 조회할 프로젝트 slug. 경로에서는 앞에 @를 붙인다.
        required: true
        schema:
          type: string
      responses:
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-find-detail-not-found:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_NOT_FOUND\",\"\
                    message\":\"프로젝트를 찾을 수 없습니다.\"}"
        "200":
          description: "200"
          content:

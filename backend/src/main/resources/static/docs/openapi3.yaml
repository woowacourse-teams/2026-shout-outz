          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeleteSuccessResponse"
              examples:
                project-delete:
                  value: "{\"status\":\"success\",\"data\":{\"slug\":\"loop\",\"deletedAt\"\
                    :\"2026-09-06T13:30:00Z\",\"restoreDeadlineAt\":\"2026-10-06T13:30:00Z\"\

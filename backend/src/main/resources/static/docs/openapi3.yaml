  /api/v1/tech-tags:
    get:
      tags:
      - TechTag
      summary: 기술 스택 조회
      description: 선택 가능한 기술 스택을 displayName 오름차순으로 반환한다. keyword가 없거나 비어 있으면 전체를
        반환한다.
      operationId: tech-tag-find-all
      parameters:
      - name: keyword
        in: query
        description: displayName 또는 slug 부분 일치 검색어 (대소문자 무시)
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:

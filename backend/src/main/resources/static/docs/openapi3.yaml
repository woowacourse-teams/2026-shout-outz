                    \ 아이템을 하나로 엮은 실시간 협업 도구\",\"cohort\":6,\"thumbnailImageId\":12,\"\
                    imageUrl\":\"https://cdn.example.com/thumbnail\",\"descriptionMd\"\
                    :\"## 문제\\n![회고 화면](https://cdn.example.com/description-21)\"\
                    ,\"descriptionMedia\":[{\"mediaId\":21,\"url\":\"https://cdn.example.com/description-21\"\
                    }],\"githubRepositoryUrl\":\"https://github.com/woowacourse-teams/2026-loop\"\
                    ,\"deploymentUrl\":\"https://loop.team\",\"serviceStatus\":\"\
                    OPERATING\",\"approvalStatus\":\"APPROVED\",\"rejectReason\":null,\"\
                    viewCount\":831,\"starCount\":128,\"likeCount\":84,\"bookmarkCount\"\
                    :28,\"likedByMe\":false,\"bookmarkedByMe\":false,\"editable\"\
                    :false,\"commentCount\":18,\"techTags\":[{\"id\":1,\"displayName\"\
                    :\"React\"},{\"id\":2,\"displayName\":\"TypeScript\"}],\"members\"\
                    :[{\"userId\":7,\"handle\":\"@dhyepark\",\"displayName\":\"박다혜\
                    \",\"userType\":\"WOOWACOURSE_CREW\",\"cohort\":6,\"track\":\"\
                    BACKEND\",\"avatarUrl\":\"https://cdn.example.com/avatar-101\"\
                    ,\"githubProfileUrl\":null},{\"userId\":null,\"handle\":null,\"\
                    displayName\":\"Archived Crew\",\"userType\":null,\"cohort\":null,\"\
                    track\":null,\"avatarUrl\":\"https://avatars.githubusercontent.com/u/1\"\

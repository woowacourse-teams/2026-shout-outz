          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                user-profile-update-avatar-not-ready:
                  value: "{\"status\":\"error\",\"code\":\"AVATAR_IMAGE_NOT_READY\"\
                    ,\"message\":\"프로필 이미지 처리가 완료되지 않았습니다.\"}"
        "401":

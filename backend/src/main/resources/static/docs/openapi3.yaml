      summary: 프로젝트 댓글 삭제
      description: 댓글 작성자 본인이 공개 프로젝트의 댓글을 soft delete한다.
      operationId: project-comment-delete
      parameters:
      - name: slug
        in: path
        description: 댓글이 속한 프로젝트 slug. 경로에서는 앞에 @를 붙인다.
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        description: 삭제할 댓글 ID
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      responses:

    post:
      tags:
      - Project
      summary: 프로젝트 등록
      description: "로그인한 우아한테크코스 크루 또는 코치를 등록자로 프로젝트를 등록한다. slug는 GitHub 리포지토리 이름을\
        \ 소문자로 바꾸고, 영문자와 숫자가 아닌 문자가 이어진 구간을 하이픈 하나로 바꾼 뒤 앞 연도와 앞뒤 하이픈을 떼서 만든다 (예:\
        \ 2026-my_app -> my-app). 문자열 값은 앞뒤 공백을 자르고, 공백만 있으면 입력하지 않은 것으로 본다 (descriptionMd\
        \ 제외). 운영 상태는 deploymentUrl이 있으면 OPERATING, 없으면 CLOSED로 저장한다. 팀원은 memberHandles로\
        \ 받은 순서대로 저장한다. 본문 이미지는 descriptionMd에 ![설명](media://{mediaId}) 형식으로 넣는다.\
        \ githubRepositoryUrl은 woowacourse-teams 조직의 리포지토리만 받으며, 리포지토리 이름 뒤의 경로, 쿼\
        리, 앵커는 버리고 https://github.com/woowacourse-teams/{repo} 형태로 저장한다. 요청값, 기술 스\
        택, 썸네일, 본문 이미지, 팀원이 유효하지 않거나 리포지토리 이름으로 slug를 만들 수 없으면 400, 로그인하지 않았으면 401,\
        \ 크루나 코치가 아니면 403, 이미 등록된 리포지토리이거나 앞 연도나 특수문자만 달라 slug가 겹치면 409를 반환한다."

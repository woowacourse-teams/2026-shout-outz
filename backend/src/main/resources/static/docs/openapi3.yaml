      operationId: user-search-get
      parameters:
      - name: keyword
        in: query
        description: 이름 또는 handle 검색어
        required: true
        schema:
          type: string
      - name: cursor
        in: query
        description: 다음 페이지 커서
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 개수(1~100), 기본값 20"
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserSearchSuccessResponse"
              examples:
                user-search-get:
                  value: "{\"status\":\"success\",\"data\":{\"items\":[{\"handle\"\
                    :\"zzaekkii\",\"displayName\":\"재키\",\"userType\":\"WOOWACOURSE_CREW\"\
                    ,\"track\":\"BACKEND\",\"cohort\":8,\"avatarImageId\":21},{\"\
                    handle\":\"coach-jack\",\"displayName\":\"재키 코치\",\"userType\"\
                    :\"WOOWACOURSE_COACH\",\"track\":null,\"cohort\":null,\"avatarImageId\"\
                    :null}]},\"meta\":{\"nextCursor\":\"eyJyZWxldmFuY2VSYW5rIjowLCJkaXNwbGF5TmFtZSI6IuyerO2CpCIsImhhbmRsZSI6Inp6YWVra2lpIn0\"\
                    ,\"hasNext\":true}}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                user-search-get-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"keyword\"\
                    ,\"message\":\"keyword는 필수입니다.\"}]}"
                user-search-get-cursor-invalid:
                  value: "{\"status\":\"error\",\"code\":\"USER_SEARCH_CURSOR_INVALID\"\
                    ,\"message\":\"유효하지 않은 사용자 검색 커서입니다.\"}"

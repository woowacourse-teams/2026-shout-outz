      responses:
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-create-duplicate:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_DUPLICATE_SLUG\"\
                    ,\"message\":\"이미 등록된 리포지토리입니다.\"}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-create-forbidden:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_REGISTRATION_FORBIDDEN\"\
                    ,\"message\":\"우아한테크코스 크루와 코치만 프로젝트를 등록할 수 있습니다.\"}"

                    ,\"message\":\"이미 등록된 리포지토리입니다.\"}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-update-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"serviceStatus\"\
                    ,\"message\":\"serviceStatus는 필수입니다.\"}]}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-update-not-found:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_NOT_FOUND\",\"\
                    message\":\"프로젝트를 찾을 수 없습니다.\"}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectUpdateSuccessResponse"

  /api/v1/projects/filters:
    get:
      tags:
      - Project
      summary: 프로젝트 필터 옵션 조회
      description: "필터 모달에 보여줄 기수 및 기술 스택 목록과, 각 항목을 골랐을 때 나오는 프로젝트 수를 조회한다. 로그인하지\
        \ 않아도 조회할 수 있다. 목록 조회에 적용 중인 검색어와 모달에서 고른 기수, 기술 스택을 전달하며, 선택이 바뀔 때마다 다시 요\
        청한다. 기수 숫자는 다른 기수를 골라도 0이 되지 않도록 기수 선택을 빼고 세고, 기술 스택 숫자는 현재 조건에 그 기술 스택을 추\
        가로 골랐을 때의 수다. 프로젝트 수가 0인 항목도 포함한다. 모달 안의 기술 스택 검색은 응답의 techTags를 이름으로 걸러 처\
        리한다. 요청 형식이 올바르지 않거나 정의되지 않은 기수이면 400을 반환한다."
      operationId: project-find-filter-options
      parameters:
      - name: keyword
        in: query
        description: 목록 조회에 적용 중인 검색어. 목록 조회의 keyword와 같은 조건으로 검색하며 100자 이하
        required: false
        schema:
          type: string
      - name: cohorts
        in: query
        description: "모달에서 고른 기수. 쉼표로 구분 (ex. 6,7)"
        required: false
        schema:
          type: string
      - name: techTagIds
        in: query
        description: "모달에서 고른 기술 스택. 쉼표로 구분 (ex. 1,2)"
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-find-filter-options-invalid-cohort:
                  value: "{\"status\":\"error\",\"code\":\"INVALID_COHORT\",\"message\"\
                    :\"정의되지 않은 우아한테크코스 기수입니다.\"}"
                project-find-filter-options-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"keyword\"\
                    ,\"message\":\"keyword는 100자를 초과할 수 없습니다.\"}]}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFilterOptionsSuccessResponse"
              examples:
                project-find-filter-options:
                  value: "{\"status\":\"success\",\"data\":{\"cohorts\":[{\"cohort\"\
                    :7,\"year\":2025,\"projectCount\":3},{\"cohort\":6,\"year\":2024,\"\
                    projectCount\":28}],\"techTags\":[{\"id\":2,\"displayName\":\"\

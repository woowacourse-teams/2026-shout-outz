        \ 않아도 조회할 수 있다. 목록 조회에 적용 중인 검색어와 모달에서 고른 기수, 기술 스택을 전달하며, 선택이 바뀔 때마다 다시 요\
        청한다. 기수 숫자는 다른 기수를 골라도 0이 되지 않도록 기수 선택을 빼고 세고, 기술 스택 숫자는 현재 조건에 그 기술 스택을 추\
        가로 골랐을 때의 수다. 프로젝트 수가 0인 항목도 포함한다. 모달 안의 기술 스택 검색은 응답의 techTags를 이름으로 걸러 처\
        리한다. 요청 형식이 올바르지 않거나 정의되지 않은 기수이면 400을 반환한다."
      operationId: project-find-filter-options
      parameters:
      - name: keyword
        in: query
        description: 목록 조회에 적용 중인 검색어. 목록 조회의 keyword와 같은 조건으로 검색하며 100자 이하

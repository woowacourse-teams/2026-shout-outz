        techTagIds:
          type: array
          description: 기술 스택 ID 전체 목록. 통째로 교체하며 배열 순서가 표시 순서가 된다. 이미 달려 있던 태그는 비활성화됐어도
            그대로 둘 수 있다.
          items:
            type: number
        memberHandles:
          type: array
          description: "팀원 handle 전체 목록 (1명 이상). 등록자를 포함할 수 있으며, 통째로 교체하며 배열 순서가 표\
            시 순서가 된다. 이미 팀원인 사용자는 탈퇴했어도 그대로 둘 수 있다. 각 handle의 앞뒤 공백은 자르며, 공백만 있는 handle은\
            \ 400이다."
          items:
            type: string
        serviceStatus:
          type: string
          description: "서비스 운영 상태. deploymentUrl이 없으면 CLOSED만 보낼 수 있으며, 어기면 400을 반\
            환한다. 이때 오류 응답의 details.field는 serviceStatusValid다."
          enum:
          - OPERATING
          - CLOSED
        descriptionMd:
          type: string
          description: "프로젝트 설명 마크다운 (100,000자 이하). 이미지는 ![설명](media://{mediaId})\
            \ 형식으로 넣으며, 상세 조회 응답의 CDN URL을 그대로 보내도 기존 본문 이미지 참조를 유지한다."
          nullable: true
        deploymentUrl:
          type: string
          description: 서비스 배포 URL (http/https). 비우려면 null로 보낸다. 빈 문자열이나 공백만 있어도 비운
            것으로 본다.
          nullable: true
        githubRepositoryUrl:
          type: string
          description: "https://github.com/woowacourse-teams/{repo} 형식 (2,048자 이하\
            ). 다른 owner의 리포지토리는 400이다. 리포지토리 이름 뒤의 .git, /, 경로(/tree/main), 쿼리(?tab=readme),\
            \ 앵커(#readme)는 허용하고 버린 뒤 저장한다. 바꿀 수 있지만 다른 프로젝트가 등록한 리포지토리로는 바꿀 수 없다.\
            \ slug는 등록 시점 값으로 고정이라 따라 바뀌지 않는다."
        cohort:
          type: number
          description: 우아한테크코스 기수 (1~8)
        tagline:
          type: string
          description: 한 줄 소개. 앞뒤 공백을 자른 뒤 200자 이하 (유니코드 코드 포인트 기준)
        title:
          type: string
          description: 프로젝트 이름. 앞뒤 공백을 자른 뒤 100자 이하 (유니코드 코드 포인트 기준)
    AdminProjectHistorySuccessResponse:
      title: AdminProjectHistorySuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - items
          - projectId
          type: object
          properties:
            items:
              type: array
              description: 상태 변경 이력
              items:
                required:
                - changedAt
                - historyId
                - toStatus
                type: object
                properties:
                  reason:
                    type: string
                    description: 반려 사유
                    nullable: true
                  toStatus:
                    type: string
                    description: 변경 후 상태
                    enum:
                    - PENDING
                    - APPROVED
                    - REJECTED
                  fromStatus:
                    type: string
                    description: 변경 전 상태. 최초 등록이면 null
                    nullable: true
                  changedBy:
                    type: object
                    description: 상태를 변경한 사용자. 최초 등록이면 null
                    nullable: true
                  historyId:
                    type: number
                    description: 이력 ID
                  changedAt:
                    type: string
                    description: 상태 변경 시각
            projectId:
              type: number
              description: 프로젝트 ID
          description: 프로젝트 심사 이력
        status:
          type: string
          description: 응답 상태
    CategoryUpdateRequest:
      title: CategoryUpdateRequest
      required:
      - displayName
      - displayOrder
      type: object
      properties:
        displayName:
          type: string
          description: 변경할 고유 표시 이름
        displayOrder:
          type: number
          description: 변경할 표시 순서
    FeedSaveRequest:
      title: FeedSaveRequest
      required:
      - categoryIds
      - content
      - mediaIds
      - title
      type: object
      properties:
        categoryIds:
          type: array
          description: "활성 카테고리 ID 목록(일반 1개, 이벤트 개수 제한 없음, 중복 불가)"
          items:
            oneOf:
            - type: object
            - type: boolean
            - type: string
            - type: number
        isAnonymous:
          type: boolean
          description: 작성자 정보를 익명으로 공개할지 여부
          nullable: true
        feedType:
          type: string
          description: 피드 유형(QUESTION 또는 POST). 생략하면 POST
          nullable: true
        mediaIds:
          type: array
          description: 작성자가 업로드한 READY FEED_CONTENT 미디어 ID 목록
          items:
            oneOf:
            - type: object
            - type: boolean
            - type: string
            - type: number
        title:
          type: string
          description: "피드 제목(공백 제외 1자 이상, Unicode 최대 100자)"
        content:
          type: string
          description: "Markdown 본문(공백 제외 1자 이상, Unicode 최대 5,000자)"
    NoticeCreateRequest:
      title: NoticeCreateRequest
      required:
      - authorName
      - body
      - summary
      - title
      type: object
      properties:
        summary:
          type: string
          description: 공지 요약
        cta:
          required:
          - label
          - url
          type: object
          properties:
            label:
              type: string
              description: CTA 라벨
            url:
              type: string
              description: CTA URL
          description: 공지 CTA
        authorName:
          type: string
          description: 공지 작성자 이름
        body:
          type: string
          description: 공지 본문
        title:
          type: string
          description: 공지 제목
    CategoryFindAllSuccessResponse:
      title: CategoryFindAllSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          type: array
          description: 활성 카테고리 목록
          items:
            required:
            - categoryId
            - displayName
            - displayOrder
            - feedType
            - slug
            - type
            type: object
            properties:
              displayName:
                type: string
                description: 표시 이름
              feedType:
                type: string
                description: 카테고리가 연결된 피드 유형
                enum:
                - POST
                - QUESTION
              displayOrder:
                type: number
                description: 표시 순서
              type:
                type: string
                description: 카테고리 유형
                enum:
                - GENERAL
                - EVENT
              slug:
                type: string
                description: 카테고리 slug
              categoryId:
                type: number
                description: 카테고리 ID
        status:
          type: string
          description: 응답 상태

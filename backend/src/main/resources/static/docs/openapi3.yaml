openapi: 3.0.1
info:
  title: Shout-outz API
  description: Shout-outz Backend API
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/cohorts:
    get:
      tags:
      - Cohort
      summary: 기수 선택지 조회
      description: 우아한테크코스 기수와 진행 연도를 최신 기수부터 반환한다.
      operationId: cohort-find-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohortFindAllSuccessResponse"
              examples:
                cohort-find-all:
                  value: "{\"status\":\"success\",\"data\":{\"items\":[{\"cohort\"\
                    :8,\"year\":2026},{\"cohort\":7,\"year\":2025},{\"cohort\":6,\"\
                    year\":2024},{\"cohort\":5,\"year\":2023},{\"cohort\":4,\"year\"\
                    :2022},{\"cohort\":3,\"year\":2021},{\"cohort\":2,\"year\":2020},{\"\
                    cohort\":1,\"year\":2019}]}}"
  /api/v1/news:
    get:
      tags:
      - News
      summary: 소식 목록 조회
      description: 소식 목록을 유형과 이벤트 상태로 필터링하고 최신순으로 조회한다.
      operationId: news-find-all
      parameters:
      - name: type
        in: query
        description: "소식 유형(ALL, NOTICE, EVENT). 기본값은 ALL"
        required: false
        schema:
          type: string
      - name: eventStatus
        in: query
        description: "이벤트 상태(UPCOMING, ONGOING, ENDED)"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: 정렬 기준. 현재 LATEST만 지원하며 기본값은 LATEST
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 개수. 기본값 20, 최댓값 50"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 다음 페이지 조회에 사용하는 opaque cursor
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                news-find-all-filter-combination-invalid-notice-ended:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-upcoming:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-notice-ongoing:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-ongoing:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-ended:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-notice-upcoming:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFindAllSuccessResponse"
              examples:
                news-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"id\":102,\"type\":\"\
                    EVENT\",\"title\":\"프로젝트 아카이빙 챌린지\",\"summary\":\"팀 프로젝트를 등록하고\
                    \ 피드백을 받아보세요.\",\"publishedAt\":\"2026-08-25T00:00:00Z\",\"eventStatus\"\
                    :\"ONGOING\",\"eventStartAt\":\"2026-08-20T00:00:00Z\",\"eventEndAt\"\
                    :\"2026-09-20T14:59:59Z\",\"isPinned\":false,\"pinOrder\":null}],\"\
                    meta\":{\"nextCursor\":null,\"hasNext\":false}}"
  /api/v1/projects:
    post:
      tags:
      - Project
      summary: 프로젝트 등록
      description: "로그인한 우아한테크코스 크루 또는 코치를 등록자로 프로젝트를 등록한다. slug는 GitHub 리포지토리 이름에\
        서 앞 연도를 떼고 소문자로 만든다. 운영 상태는 deploymentUrl이 있으면 OPERATING, 없으면 CLOSED로 저장한다\
        . 팀원은 등록자를 첫 번째로 두고 memberHandles 순서대로 저장한다. 본문 이미지는 descriptionMd에 ![설명](media://{mediaId})\
        \ 형식으로 넣는다. 요청값, 기술 스택, 썸네일, 본문 이미지, 팀원이 유효하지 않으면 400, 로그인하지 않았으면 401, 크루나\
        \ 코치가 아니면 403, 이미 등록된 리포지토리면 409를 반환한다."
      operationId: project-create
      parameters:
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
            examples:
              project-create-duplicate:

openapi: 3.0.1
info:
  title: Shout-outz API
  description: Shout-outz Backend API
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/categories:
    get:
      tags:
      - Category
      summary: 카테고리 목록 조회
      description: 피드 작성에 사용할 활성 카테고리를 표시 순서대로 조회한다.
      operationId: category-find-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryFindAllSuccessResponse"
              examples:
                category-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"categoryId\":1,\"slug\"\
                    :\"backend\",\"displayName\":\"백엔드\",\"type\":\"GENERAL\",\"displayOrder\"\
                    :1},{\"categoryId\":2,\"slug\":\"tecode-talk\",\"displayName\"\
                    :\"테코드톡\",\"type\":\"EVENT\",\"displayOrder\":2}]}"
    post:
      tags:
      - Category
      summary: 카테고리 생성
      description: 관리자가 일반 또는 이벤트 카테고리를 생성한다.
      operationId: category-save
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CategorySaveRequest"
            examples:
              category-save-unauthorized:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "displayOrder": 1
                  }
              category-save-invalid:
                value: |
                  {
                    "slug": "Backend!",
                    "displayName": " ",
                    "displayOrder": -1
                  }
              category-save-conflict:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "displayOrder": 1
                  }
              category-save-forbidden:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "displayOrder": 1
                  }
              category-save:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "displayOrder": 1
                  }
      responses:
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"type\",\"\
                    message\":\"type은 필수입니다.\"},{\"field\":\"displayName\",\"message\"\
                    :\"displayName은 필수입니다.\"},{\"field\":\"slug\",\"message\":\"slug\
                    \ 형식이 올바르지 않습니다.\"},{\"field\":\"displayOrder\",\"message\":\"\
                    displayOrder는 0 이상이어야 합니다.\"}]}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-conflict:
                  value: "{\"status\":\"error\",\"code\":\"CATEGORY_ALREADY_EXISTS\"\
                    ,\"message\":\"이미 존재하는 slug 또는 표시 이름입니다.\"}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-forbidden:
                  value: "{\"status\":\"error\",\"code\":\"CATEGORY_ADMIN_FORBIDDEN\"\
                    ,\"message\":\"관리자만 카테고리를 변경할 수 있습니다.\"}"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySaveSuccessResponse"
              examples:
                category-save:
                  value: "{\"status\":\"success\",\"data\":{\"categoryId\":1,\"slug\"\
                    :\"backend\",\"displayName\":\"백엔드\",\"type\":\"GENERAL\",\"displayOrder\"\
                    :1,\"active\":true}}"
  /api/v1/cohorts:
    get:
      tags:
      - Cohort
      summary: 기수 선택지 조회
      description: 우아한테크코스 기수와 진행 연도를 최신 기수부터 반환한다.
      operationId: cohort-find-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohortFindAllSuccessResponse"
              examples:
                cohort-find-all:
                  value: "{\"status\":\"success\",\"data\":{\"items\":[{\"cohort\"\
                    :8,\"year\":2026},{\"cohort\":7,\"year\":2025},{\"cohort\":6,\"\
                    year\":2024},{\"cohort\":5,\"year\":2023},{\"cohort\":4,\"year\"\
                    :2022},{\"cohort\":3,\"year\":2021},{\"cohort\":2,\"year\":2020},{\"\
                    cohort\":1,\"year\":2019}]}}"
  /api/v1/feeds:
    get:
      tags:
      - Feed
      summary: 피드 목록 조회
      description: 전체 공개 피드를 최신순 또는 전체 기간 인기순 Slice로 조회한다.
      operationId: feed-find-all
      parameters:
      - name: sort
        in: query
        description: "LATEST 또는 POPULAR, 기본 LATEST"
        required: false
        schema:
          type: string
      - name: categoryId
        in: query
        description: 카테고리 ID
        required: false
        schema:
          type: integer
          format: int32
      - name: cursor
        in: query
        description: 다음 Slice 커서
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 크기(기본 20, 최대 100)"
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-find-all-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"sort\",\"\
                    message\":\"Failed to convert value of type 'java.lang.String'\
                    \ to required type 'com.shoutoutz.api.feed.application.dto.FeedSort';\
                    \ Failed to convert from type [java.lang.String] to type [com.shoutoutz.api.feed.application.dto.FeedSort]\
                    \ for value [INVALID]\"}]}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedFindAllSuccessResponse"
              examples:
                feed-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"feedId\":10,\"title\"\
                    :\"피드 제목\",\"content\":\"본문입니다.\",\"author\":{\"handle\":\"zzaekkii\"\
                    ,\"displayName\":\"재키\",\"userType\":\"WOOWACOURSE_CREW\",\"track\"\
                    :\"BACKEND\",\"cohort\":8,\"avatarImageId\":21,\"avatarUrl\":\"\
                    https://cdn.example.com/media/21/display\"},\"categories\":[{\"\
                    categoryId\":3,\"slug\":\"backend\",\"displayName\":\"백엔드\",\"\
                    type\":\"GENERAL\"}],\"media\":[{\"mediaId\":21,\"url\":\"https://cdn.example.com/media/21/display\"\
                    ,\"displayOrder\":0}],\"createdAt\":\"2026-09-11T00:00:00Z\",\"\
                    updatedAt\":\"2026-09-11T00:00:00Z\"}],\"meta\":{\"nextCursor\"\
                    :\"next-cursor\",\"hasNext\":true}}"
    post:
      tags:
      - Feed
      summary: 피드 작성
      description: 크루 또는 코치가 카테고리와 업로드 완료된 본문 이미지를 연결해 피드를 작성한다.
      operationId: feed-save
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/FeedSaveRequest"
            examples:
              feed-save-forbidden:
                value: |
                  {"title":"피드 제목","content":"본문","categoryIds":[1],"mediaIds":[]}
              feed-save-invalid:
                value: |
                  {"title":"제목","content":"   ","categoryIds":[1],"mediaIds":[]}
              feed-save-unauthorized:
                value: |
                  {"title":"피드 제목","content":"본문","categoryIds":[1],"mediaIds":[]}
              feed-save:
                value: |
                  {
                    "title": "피드 제목",
                    "content": "본문입니다.",
                    "categoryIds": [3],
                    "mediaIds": [21]
                  }
      responses:
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-save-forbidden:
                  value: "{\"status\":\"error\",\"code\":\"FEED_WRITER_TYPE_FORBIDDEN\"\
                    ,\"message\":\"크루 또는 코치만 피드를 작성할 수 있습니다.\"}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-save-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"content\"\
                    ,\"message\":\"content는 필수입니다.\"}]}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-save-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSaveSuccessResponse"
              examples:
                feed-save:
                  value: "{\"status\":\"success\",\"data\":{\"feedId\":10,\"title\"\
                    :\"피드 제목\",\"content\":\"본문입니다.\",\"author\":{\"handle\":\"zzaekkii\"\
                    ,\"displayName\":\"재키\",\"userType\":\"WOOWACOURSE_CREW\",\"track\"\
                    :\"BACKEND\",\"cohort\":8,\"avatarUrl\":\"https://cdn.example.com/media/21/display\"\
                    },\"categories\":[{\"categoryId\":3,\"slug\":\"backend\",\"displayName\"\
                    :\"백엔드\",\"type\":\"GENERAL\"}],\"media\":[{\"url\":\"https://cdn.example.com/media/21/display\"\
                    ,\"displayOrder\":0}],\"createdAt\":\"2026-09-11T00:00:00Z\",\"\
                    updatedAt\":\"2026-09-11T00:00:00Z\"}}"
  /api/v1/news:
    get:
      tags:
      - News
      summary: 소식 목록 조회
      description: 소식 목록을 유형과 이벤트 상태로 필터링하고 최신순으로 조회한다.
      operationId: news-find-all
      parameters:
      - name: type
        in: query
        description: "소식 유형(ALL, NOTICE, EVENT). 기본값은 ALL"
        required: false
        schema:
          type: string
      - name: eventStatus
        in: query
        description: "이벤트 상태(UPCOMING, ONGOING, ENDED)"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: 정렬 기준. 현재 LATEST만 지원하며 기본값은 LATEST
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 개수. 기본값 20, 최댓값 50"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 다음 페이지 조회에 사용하는 opaque cursor
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                news-find-all-filter-combination-invalid-notice-ended:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-upcoming:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-notice-ongoing:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-ongoing:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-ended:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-notice-upcoming:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFindAllSuccessResponse"
              examples:
                news-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"id\":102,\"type\":\"\
                    EVENT\",\"title\":\"프로젝트 아카이빙 챌린지\",\"summary\":\"팀 프로젝트를 등록하고\
                    \ 피드백을 받아보세요.\",\"publishedAt\":\"2026-08-25T00:00:00Z\",\"eventStatus\"\
                    :\"ONGOING\",\"eventStartAt\":\"2026-08-20T00:00:00Z\",\"eventEndAt\"\
                    :\"2026-09-20T14:59:59Z\",\"isPinned\":false,\"pinOrder\":null}],\"\
                    meta\":{\"nextCursor\":null,\"hasNext\":false}}"
  /api/v1/projects:
    get:
      tags:
      - Project
      summary: 프로젝트 목록 조회
      description: "승인된 프로젝트 목록을 검색어, 기수, 기술 스택으로 걸러 정렬 기준대로 조회한다. 로그인하지 않아도 조회할 수\
        \ 있다. 커서 기반으로, 첫 요청은 cursor를 생략하고 다음 요청부터 응답의 meta.nextCursor를 그대로 전달한다. 정\
        렬을 바꾸면 cursor 없이 처음부터 다시 요청한다. POPULAR에서 좋아요 수가 같으면 최근 등록된 프로젝트가 앞에 온다. 요청\
        \ 형식이 올바르지 않거나, 정의되지 않은 기수이거나, 커서가 올바르지 않으면 400을 반환한다."
      operationId: project-find-all
      parameters:
      - name: keyword
        in: query
        description: "프로젝트 이름, 한 줄 소개, 참여 크루 이름, 기술 스택 이름 검색어. 대소문자를 무시한 부분 일치이며 100자\
          \ 이하"
        required: false
        schema:
          type: string
      - name: cohorts
        in: query
        description: "기수 필터. 쉼표로 구분 (ex. 6,7). 선택한 기수 중 하나에 해당하면 조회"
        required: false
        schema:
          type: string
      - name: techTagIds
        in: query
        description: "기술 스택 필터. 쉼표로 구분 (ex. 1,2,3). 선택한 기술 스택을 모두 사용한 프로젝트만 조회"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 기준 (LATEST, POPULAR). 기본값 LATEST"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 번에 가져올 프로젝트 수. 기본값 8, 1~50"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "다음 페이지 조회용 커서. 첫 요청은 생략하고, 이후 응답의 meta.nextCursor를 그대로 전달"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFindAllSuccessResponse"
              examples:
                project-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"id\":100,\"slug\":\"\
                    loop\",\"title\":\"루프 (Loop)\",\"tagline\":\"스프린트 회고와 액션 아이템을\
                    \ 하나로 엮은 실시간 협업 도구\",\"cohort\":6,\"thumbnailImageId\":12,\"thumbnailUrl\"\
                    :\"https://cdn.example.com/thumbnail\",\"starCount\":128,\"likeCount\"\
                    :184,\"commentCount\":14,\"techTags\":[{\"id\":1,\"displayName\"\
                    :\"React\"},{\"id\":2,\"displayName\":\"Spring\"}],\"members\"\
                    :[{\"handle\":\"dhyepark\",\"displayName\":\"박다혜\",\"cohort\"\
                    :6,\"track\":\"BACKEND\",\"avatarImageId\":101,\"avatarUrl\":\"\
                    https://cdn.example.com/avatar-101\",\"githubAvatarUrl\":null,\"\
                    githubProfileUrl\":null},{\"handle\":\"zzaekkii\",\"displayName\"\
                    :\"김도현\",\"cohort\":6,\"track\":\"FRONTEND\",\"avatarImageId\"\
                    :null,\"avatarUrl\":null,\"githubAvatarUrl\":null,\"githubProfileUrl\"\
                    :null}]}],\"meta\":{\"nextCursor\":\"UE9QVUxBUnwxODR8MjAyNi0wOC0wOVQwMjozMDowMFp8MTAw\"\
                    ,\"hasNext\":true,\"totalCount\":48}}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-find-all-invalid-cursor:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_INVALID_CURSOR\"\
                    ,\"message\":\"프로젝트 목록 조회 커서가 올바르지 않습니다. 커서 없이 처음부터 다시 조회해주세요\
                    .\"}"
                project-find-all-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"size\",\"\
                    message\":\"size는 50 이하여야 합니다.\"}]}"
                project-find-all-invalid-cohort:
                  value: "{\"status\":\"error\",\"code\":\"INVALID_COHORT\",\"message\"\
                    :\"정의되지 않은 우아한테크코스 기수입니다.\"}"
    post:
      tags:
      - Project
      summary: 프로젝트 등록
      description: "로그인한 우아한테크코스 크루 또는 코치를 등록자로 프로젝트를 등록한다. slug는 GitHub 리포지토리 이름에\
        서 앞 연도를 떼고 소문자로 만든다. 운영 상태는 deploymentUrl이 있으면 OPERATING, 없으면 CLOSED로 저장한다\
        . 팀원은 등록자를 첫 번째로 두고 memberHandles 순서대로 저장한다. 본문 이미지는 descriptionMd에 ![설명](media://{mediaId})\
        \ 형식으로 넣는다. 요청값, 기술 스택, 썸네일, 본문 이미지, 팀원이 유효하지 않으면 400, 로그인하지 않았으면 401, 크루나\
        \ 코치가 아니면 403, 이미 등록된 리포지토리이거나 리포지토리 이름이 같아 slug가 겹치면 409를 반환한다."
      operationId: project-create
      parameters:
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/ProjectCreateRequest"
            examples:
              project-create-duplicate:
                value: |
                  {
                    "title": "루프 (Loop)",
                    "teamName": "루프팀",
                    "tagline": "스프린트 회고와 액션 아이템을 하나로 엮은 실시간 협업 도구",
                    "cohort": 6,
                    "thumbnailImageId": 12,
                    "githubRepositoryUrl": "https://github.com/woowacourse-teams/2026-loop",

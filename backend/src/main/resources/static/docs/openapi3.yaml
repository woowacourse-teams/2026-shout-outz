                    니다.\",\"author\":{\"userId\":8,\"displayName\":\"재키\",\"avatarImageId\"\
                    :11,\"avatarUrl\":\"https://cdn.example.com/media/11/display\"\
                    },\"parentId\":501,\"createdAt\":\"2026-09-14T00:05:00Z\",\"updatedAt\"\
                    :\"2026-09-14T00:05:00Z\",\"editable\":false,\"edited\":false,\"\
                    deleted\":false},{\"id\":503,\"content\":null,\"author\":{\"userId\"\
                    :9,\"displayName\":\"이전 작성자\",\"avatarImageId\":12,\"avatarUrl\"\
                    :\"https://cdn.example.com/media/12/display\"},\"parentId\":null,\"\
                    createdAt\":\"2026-09-14T00:10:00Z\",\"updatedAt\":\"2026-09-14T00:10:00Z\"\

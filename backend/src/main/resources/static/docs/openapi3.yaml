components:
  schemas:
    UserSearchSuccessResponse:
      title: UserSearchSuccessResponse
      required:
      - data
      - meta
      - status
      type: object
      properties:
        data:
          required:
          - items
          type: object
          properties:
            items:
              type: array
              description: 검색된 크루와 코치
              items:
                required:
                - displayName
                - handle
                - userType
                type: object
                properties:
                  avatarImageId:
                    type: number
                    description: 프로필 이미지 미디어 ID
                    nullable: true
                  displayName:
                    type: string
                    description: 표시 이름
                  cohort:
                    type: number
                    description: 우테코 기수
                    nullable: true
                  handle:
                    type: string
                    description: 사용자 handle
                  userType:
                    type: string
                    description: 사용자 유형
                  track:
                    type: string
                    description: 우테코 트랙
                    nullable: true
          description: 검색 결과
        meta:
          required:
          - hasNext
          type: object
          properties:
            nextCursor:
              type: string
              description: 다음 페이지 커서
              nullable: true
            hasNext:
              type: boolean
              description: 다음 페이지 존재 여부
          description: 페이지 정보
        status:
          type: string
          description: 응답 상태
    VisitorSaveRequest:
      title: VisitorSaveRequest
      required:
      - example
      type: object
      properties:
        example:
          type: string
          description: 방문자 예시 값
    FeedFindSuccessResponse:
      title: FeedFindSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - author
          - categories
          - content
          - createdAt
          - feedId
          - media
          - updatedAt
          type: object
          properties:
            createdAt:
              type: string
              description: ISO-8601 생성 시각
            feedId:
              type: number
              description: 피드 ID
            author:
              required:
              - displayName
              - handle
              - userType
              type: object
              properties:
                avatarImageId:
                  type: number
                  description: 현재 프로필 이미지 미디어 ID
                  nullable: true
                displayName:
                  type: string
                  description: 작성자 이름
                cohort:
                  type: number
                  description: 작성자 기수
                  nullable: true
                handle:
                  type: string
                  description: 작성자 핸들
                userType:
                  type: string
                  description: 작성자 유형
                track:
                  type: string
                  description: 작성자 트랙
                  nullable: true
              description: 현재 작성자 프로필
            media:
              type: array
              description: 본문 미디어 목록
              items:
                required:
                - displayOrder
                - mediaId
                type: object
                properties:
                  displayOrder:
                    type: number
                    description: 미디어 표시 순서
                  mediaId:
                    type: number
                    description: 미디어 ID
            categories:
              type: array
              description: 카테고리 목록
              items:
                required:
                - categoryId
                - displayName
                - slug
                - type
                type: object
                properties:
                  displayName:
                    type: string
                    description: 카테고리 표시 이름
                  type:
                    type: string
                    description: GENERAL 또는 EVENT
                  slug:
                    type: string
                    description: 카테고리 slug
                  categoryId:
                    type: number
                    description: 카테고리 ID
            content:
              type: string
              description: Markdown 본문
            updatedAt:
              type: string
              description: ISO-8601 수정 시각
          description: 피드
        status:
          type: string
          description: 응답 상태

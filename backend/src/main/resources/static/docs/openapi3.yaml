                    :\"2026-09-16T00:05:00Z\"}],\"meta\":{\"nextCursor\":\"next-cursor\"\
                    ,\"hasNext\":true}}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                user-comment-find-all-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"

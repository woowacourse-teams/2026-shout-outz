  /api/v1/users/me/summary:
    get:
      tags:
      - User
      summary: 내 프로필 요약 조회
      description: 로그인 후 공통 헤더에 표시할 최소 사용자 정보를 조회한다.
      operationId: user-profile-summary-get
      parameters:
      - name: Cookie
        in: header
        description: 인증된 사용자의 JSESSIONID
        required: true
        schema:
          type: string
        example: JSESSIONID=session-id
      responses:
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                user-profile-summary-get-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileSummarySuccessResponse"
              examples:
                user-profile-summary-get:
                  value: "{\"status\":\"success\",\"data\":{\"handle\":\"zzaekkii\"\
                    ,\"displayName\":\"재키\",\"avatarImageId\":21}}"
  /api/v1/projects/100/comments/501:
    delete:
      tags:
      - Project Comment
      summary: 프로젝트 댓글 삭제
      description: 댓글 작성자 본인이 공개 프로젝트의 댓글을 soft delete한다.
      operationId: project-comment-delete
      parameters:
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommentDeleteSuccessResponse"
              examples:
                project-comment-delete:
                  value: "{\"status\":\"success\",\"data\":{\"id\":501,\"deleted\"\
                    :true}}"
    patch:
      tags:
      - Project Comment
      summary: 프로젝트 댓글 수정
      description: 로그인한 프로젝트 댓글 작성자가 공개 프로젝트의 댓글 내용을 수정한다. 트림 후 기존 내용과 같으면 저장하지 않고
        수정 시각을 유지한다.
      operationId: project-comment-update
      parameters:
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/ProjectCommentUpdateRequest"
            examples:
              project-comment-update:
                value: |
                  {
                    "content": "  수정된 댓글입니다.  "
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommentUpdateSuccessResponse"
              examples:
                project-comment-update:
                  value: "{\"status\":\"success\",\"data\":{\"id\":501,\"content\"\
                    :\"수정된 댓글입니다.\",\"author\":{\"userId\":7,\"displayName\":\"샤라웃\
                    \ 운영팀\",\"avatarImageId\":10},\"parentId\":null,\"createdAt\"\
                    :\"2026-09-14T00:00:00Z\",\"updatedAt\":\"2026-09-14T00:30:00Z\"\
                    ,\"editable\":true,\"edited\":true}}"
  /oauth2/authorization/github:
    get:
      tags:
      - Auth
      summary: GitHub 로그인 시작
      description: state와 PKCE 값을 생성해 세션에 저장하고 GitHub 인가 화면으로 이동한다.
      operationId: auth-github-authorization
      responses:
        "302":
          description: "302"
          headers:
            Location:
              description: GitHub OAuth 인가 화면 URI
              schema:
                type: string
            Set-Cookie:
              description: OAuth 로그인 시도를 저장한 JSESSIONID
              schema:
                type: string
components:
  schemas:
    UserSearchSuccessResponse:
      title: UserSearchSuccessResponse
      required:
      - data
      - meta
      - status
      type: object
      properties:
        data:
          required:
          - items
          type: object
          properties:
            items:
              type: array
              description: 검색된 크루와 코치
              items:
                required:
                - displayName
                - handle
                - userType
                type: object
                properties:
                  avatarImageId:
                    type: number
                    description: 프로필 이미지 미디어 ID
                    nullable: true
                  displayName:
                    type: string
                    description: 표시 이름
                  cohort:
                    type: number
                    description: 우테코 기수
                    nullable: true
                  handle:
                    type: string
                    description: 사용자 handle
                  userType:
                    type: string
                    description: 사용자 유형
                  track:
                    type: string
                    description: 우테코 트랙
                    nullable: true
          description: 검색 결과
        meta:
          required:
          - hasNext
          type: object
          properties:
            nextCursor:
              type: string
              description: 다음 페이지 커서
              nullable: true
            hasNext:
              type: boolean
              description: 다음 페이지 존재 여부
          description: 페이지 정보
        status:
          type: string
          description: 응답 상태
    VisitorSaveRequest:
      title: VisitorSaveRequest
      required:
      - example
      type: object
      properties:
        example:
          type: string
          description: 방문자 예시 값
    UserProfileSummarySuccessResponse:
      title: UserProfileSummarySuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - displayName
          - handle
          type: object
          properties:
            avatarImageId:
              type: number
              description: 프로필 이미지 미디어 ID
              nullable: true
            displayName:
              type: string
              description: 표시 이름
            handle:
              type: string
              description: 사용자 handle
          description: 프로필 요약 정보
        status:
          type: string
          description: 응답 상태
    OAuthSignupRequest:
      title: OAuthSignupRequest
      required:
      - displayName
      - handle
      type: object
      properties:
        displayName:
          type: string
          description: 프로필 표시 이름
        handle:
          type: string
          description: 영구 공개 핸들
    UserProfileSuccessResponse:
      title: UserProfileSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - counts
          - displayName
          - handle
          type: object
          properties:
            avatarImageId:
              type: number
              description: 프로필 이미지 미디어 ID
              nullable: true
            counts:
              required:
              - posts
              - projects
              type: object
              properties:
                projects:
                  type: number
                  description: 삭제되지 않은 참여 프로젝트 개수
                posts:
                  type: number
                  description: 삭제되지 않은 작성 피드 개수
              description: 프로필 항목 개수
            displayName:
              type: string
              description: 표시 이름
            blogUrl:
              type: string
              description: 블로그 URL
              nullable: true
            githubProfileUrl:
              type: string
              description: GitHub 프로필 URL
              nullable: true
            bio:
              type: string
              description: 한 줄 소개
              nullable: true
            cohort:
              type: number
              description: 우테코 기수
              nullable: true
            handle:
              type: string
              description: 사용자 handle
            userType:
              type: string
              description: 사용자 유형
              nullable: true
            track:
              type: string
              description: 우테코 트랙
              nullable: true
          description: 사용자 공개 프로필
        status:
          type: string
          description: 응답 상태
    UserProfileUpdateRequest:
      title: UserProfileUpdateRequest
      required:
      - displayName
      type: object
      properties:
        avatarImageId:
          type: number
          description: READY 상태의 USER_AVATAR 미디어 ID
          nullable: true
        displayName:
          type: string
          description: 표시 이름. 인증된 우테코 사용자는 변경 불가
        blogUrl:
          type: string
          description: 블로그 URL
          nullable: true
        githubProfileUrl:
          type: string
          description: GitHub 프로필 URL
          nullable: true
        bio:
          type: string
          description: 한 줄 소개
          nullable: true
    TechTagFindAllSuccessResponse:
      title: TechTagFindAllSuccessResponse
      required:
      - status
      type: object
      properties:
        data:
          required:
          - items
          type: object
          properties:
            items:
              type: array
              description: 기술 스택 목록
              items:
                required:
                - displayName
                - id
                type: object
                properties:
                  displayName:
                    type: string
                    description: 화면 표시 이름
                  id:
                    type: number
                    description: 기술 스택 ID
        status:
          type: string
          description: 응답 상태
    NoticeCreateSuccessResponse:
      title: NoticeCreateSuccessResponse
      required:
      - status
      type: object
      properties:
        data:
          required:
          - author
          - body
          - id
          - isPinned
          - publishedAt
          - summary
          - title
          - type
          type: object
          properties:

  /api/v1/projects/{projectId}/comments/{commentId}:
    delete:
      tags:
      - Project Comment
      summary: 프로젝트 댓글 삭제
      description: 댓글 작성자 본인이 공개 프로젝트의 댓글을 soft delete한다.
      operationId: project-comment-delete
      parameters:
      - name: projectId
        in: path
        description: 댓글이 속한 프로젝트 ID
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        description: 삭제할 댓글 ID
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommentDeleteSuccessResponse"
              examples:
                project-comment-delete:
                  value: "{\"status\":\"success\",\"data\":{\"id\":501,\"deleted\"\
                    :true}}"
    patch:
      tags:
      - Project Comment
      summary: 프로젝트 댓글 수정
      description: 로그인한 프로젝트 댓글 작성자가 공개 프로젝트의 댓글 내용을 수정한다. 트림 후 기존 내용과 같으면 저장하지 않고
        수정 시각을 유지한다.
      operationId: project-comment-update
      parameters:
      - name: projectId
        in: path
        description: 댓글이 속한 프로젝트 ID
        required: true
        schema:
          type: string
      - name: commentId
        in: path
        description: 수정할 댓글 ID
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/ProjectCommentUpdateRequest"
            examples:
              project-comment-update:
                value: |
                  {
                    "content": "  수정된 댓글입니다.  "
                  }
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectCommentUpdateSuccessResponse"
              examples:
                project-comment-update:
                  value: "{\"status\":\"success\",\"data\":{\"id\":501,\"content\"\
                    :\"수정된 댓글입니다.\",\"author\":{\"userId\":7,\"displayName\":\"샤라웃\
                    \ 운영팀\",\"avatarUrl\":\"https://cdn.example.com/media/10/display\"\
                    },\"parentId\":null,\"createdAt\":\"2026-09-14T00:00:00Z\",\"\
                    updatedAt\":\"2026-09-14T00:30:00Z\",\"editable\":true,\"edited\"\
                    :true}}"
  /oauth2/authorization/github:
    get:
      tags:
      - Auth
      summary: GitHub 로그인 시작
      description: state와 PKCE 값을 생성해 세션에 저장하고 GitHub 인가 화면으로 이동한다.
      operationId: auth-github-authorization
      responses:
        "302":
          description: "302"
          headers:
            Location:
              description: GitHub OAuth 인가 화면 URI
              schema:
                type: string
            Set-Cookie:
              description: OAuth 로그인 시도를 저장한 JSESSIONID
              schema:
                type: string

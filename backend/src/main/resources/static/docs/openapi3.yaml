        에서 다른 사용자에게 보이지 않으며, 등록자 본인은 상세에서 확인할 수 있다. 응답의 restoreDeadlineAt 까지 복구할 수\
        \ 있다. 로그인하지 않았으면 401, 없거나 형식이 틀린 slug이거나, 등록자가 아니거나 이미 삭제된 프로젝트이면 404를 반환한\
        다."

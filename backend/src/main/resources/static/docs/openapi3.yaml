  /api/v1/projects/{projectId}/restore:
    post:
      tags:
      - Project
      summary: 프로젝트 복구
      description: "등록자 본인이 삭제한 자신의 프로젝트를 복구 기한 안에 되살린다. 승인 상태는 삭제 이전 값을 그대로 유지한다\
        . 로그인하지 않았으면 401, 없는 프로젝트이거나 등록자가 아니거나 삭제되지 않은 프로젝트이면 404, 복구 기한이 지났으면 409를\
        \ 반환한다. 복구 기한이 지난 프로젝트는 이후 영구 삭제되어 복구할 수 없다."
      operationId: project-restore
      parameters:
      - name: projectId
        in: path
        description: 복구할 프로젝트 ID
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRestoreSuccessResponse"
              examples:
                project-restore:
                  value: "{\"status\":\"success\",\"data\":{\"id\":100,\"approvalStatus\"\
                    :\"APPROVED\",\"restoredAt\":\"2026-09-10T05:20:00Z\"}}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-restore-deadline-expired:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_RESTORE_DEADLINE_EXPIRED\"\
                    ,\"message\":\"복구 기한이 지나 프로젝트를 복구할 수 없습니다.\"}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-restore-not-found:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_NOT_FOUND\",\"\
                    message\":\"프로젝트를 찾을 수 없습니다.\"}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-restore-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
  /api/v1/projects/{projectId}/views:
    post:
      tags:
      - Project
      summary: 프로젝트 조회 기록
      description: "프로젝트 상세 페이지에 들어갈 때 조회를 기록하고, 이번 조회를 반영한 조회수를 반환한다. 상세 조회 API와\
        \ 함께(병렬로) 호출하고, 화면의 조회수는 상세 조회 응답으로 먼저 그린 뒤 이 응답의 viewCount로 바꾼다. 같은 방문자가\
        \ 같은 날(한국 시간 기준) 같은 프로젝트를 여러 번 조회해도 조회수는 한 번만 오르며, 다시 조회하면 200과 현재 조회수를 반환\
        한다. 방문자는 서버가 발급한 VISITOR_ID 쿠키로 구분하므로 쿠키를 함께 보내도록 호출한다(credentials: include).\
        \ 쿠키가 없거나 형식이 잘못되면 이 응답에서 새로 발급한다. 로그인하지 않아도 기록하며, CSRF 토큰은 로그인 상태에서만 필요하다\
        . 없거나 삭제됐거나 승인되지 않은 프로젝트면 404를 반환한다. 이 API가 실패해도 상세 페이지 표시에는 영향이 없도록 무시한다."
      operationId: project-view-record
      parameters:
      - name: projectId
        in: path
        description: 조회한 프로젝트 ID
        required: true
        schema:
          type: string
      - name: Cookie
        in: header
        description: 서버가 발급한 VISITOR_ID. 로그인 상태면 JSESSIONID도 함께 보낸다. 처음 방문해 쿠키가 없으면
          생략된다.
        required: false
        schema:
          type: string
        example: VISITOR_ID=3f2a1b4c-5d6e-4f70-8a9b-0c1d2e3f4a5b
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectViewRecordSuccessResponse"
              examples:
                project-view-record:
                  value: "{\"status\":\"success\",\"data\":{\"viewCount\":129}}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-view-record-not-found:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_NOT_FOUND\",\"\
                    message\":\"프로젝트를 찾을 수 없습니다.\"}"
  /api/v1/users/me/comments:
    get:
      tags:
      - User
      summary: 내 댓글 목록 조회
      description: "로그인한 사용자가 작성한 피드와 프로젝트 댓글을 최신순으로 조회한다. 삭제되지 않은 공개 대상의 댓글만 반환하며\
        , type과 targetId로 이동할 대상을 구분한다. 응답의 meta.nextCursor를 다음 요청에 그대로 전달한다."
      operationId: user-comment-find-all
      parameters:
      - name: cursor
        in: query
        description: 다음 페이지 조회용 커서. 첫 요청은 생략

  /oauth2/authorization/github:
    get:
      tags:
      - Auth
      summary: GitHub 로그인 시작
      description: state와 PKCE 값을 생성해 세션에 저장하고 GitHub 인가 화면으로 이동한다. 허용 목록에 있는 returnTo가
        있으면 Callback 완료 후 해당 프론트엔드로 이동한다.
      operationId: auth-github-authorization
      parameters:
      - name: returnTo
        in: query
        description: OAuth 완료 후 이동할 허용된 프론트엔드 URI
        required: false
        schema:
          type: string
      responses:
        "302":
          description: "302"
          headers:
            Location:
              description: GitHub OAuth 인가 화면 URI
              schema:
                type: string
            Set-Cookie:
              description: OAuth 로그인 시도를 저장한 JSESSIONID
              schema:
                type: string
components:
  schemas:
    NotificationListSuccessResponse:
      title: NotificationListSuccessResponse
      required:
      - data
      - meta
      - status
      type: object
      properties:
        data:
          type: array
          description: 알림 목록
          items:
            required:
            - createdAt
            - isRead
            - message
            - notificationId
            - notificationType
            type: object
            properties:
              actor:
                type: object
                properties:
                  avatarUrl:
                    type: string
                    description: 직접 업로드한 이미지가 없으면 GitHub 아바타를 사용하는 사용자 아바타 URL
                    nullable: true
                  displayName:
                    type: string
                    description: 사용자 표시 이름
                    nullable: true
                  handle:
                    type: string
                    description: 사용자 handle
                    nullable: true
                  userId:
                    type: number
                    description: 사용자 ID
                    nullable: true
                description: 알림을 발생시킨 사용자
              createdAt:
                type: string
                description: 알림 생성 시각
              feedId:
                type: number
                description: 대상 피드 ID
                nullable: true
              isRead:
                type: boolean
                description: 읽음 상태
              commentId:
                type: number
                description: 대상 댓글 ID
                nullable: true
              notificationId:
                type: number
                description: 알림 ID
              notificationType:
                type: string
                description: 알림 타입
              feedTitle:
                type: string
                description: 대상 피드 제목
                nullable: true
              message:
                type: string
                description: 알림 메시지
        meta:
          required:
          - hasNext
          - totalCount
          type: object
          properties:
            nextCursor:
              type: string
              description: 다음 페이지 커서
              nullable: true
            hasNext:
              type: boolean
              description: 다음 페이지 존재 여부
            totalCount:
              type: number
              description: 전체 알림 수
          description: 페이지 정보
        status:
          type: string
          description: 응답 상태
    AdminVerificationRequestRejectRequest:
      title: AdminVerificationRequestRejectRequest
      required:
      - reason
      type: object
      properties:
        reason:
          type: string
          description: 반려 사유(앞뒤 공백 제거 후 1~100자)
    FeedCommentDeleteSuccessResponse:
      title: FeedCommentDeleteSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - deleted
          - id
          type: object
          properties:
            deleted:
              type: boolean
              description: 댓글 삭제 여부
            id:
              type: number
              description: 삭제된 댓글 ID
          description: 삭제된 댓글
        status:
          type: string
          description: 응답 상태
    AdminVerificationRequestRejectSuccessResponse:
      title: AdminVerificationRequestRejectSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - decidedAt
          - decidedBy
          - reason
          - requestId
          - status
          type: object
          properties:
            reason:
              type: string
              description: 반려 사유
            requestId:
              type: number
              description: 인증 신청 ID
            decidedAt:
              type: string
              description: 반려 시각(ISO-8601)
            decidedBy:
              required:
              - handle
              - userId
              type: object
              properties:
                handle:
                  type: string
                  description: 반려한 관리자 handle
                userId:
                  type: number
                  description: 반려한 관리자 사용자 ID
              description: 반려한 관리자
            status:
              type: string
              description: 변경된 신청 상태
              enum:
              - PENDING
              - APPROVED
              - REJECTED
          description: 반려 결과
        status:
          type: string
          description: 응답 상태
    AdminVerificationRequestHistorySuccessResponse:
      title: AdminVerificationRequestHistorySuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - items
          - requestId
          type: object
          properties:
            requestId:
              type: number
              description: 인증 신청 ID
            items:
              type: array
              description: 상태 변경 이력(최신순)
              items:
                required:
                - changedAt
                - historyId
                - toStatus
                type: object
                properties:
                  reason:
                    type: string
                    description: 반려 사유. 승인 또는 최초 신청이면 null
                    nullable: true
                  toStatus:
                    type: string
                    description: 변경 후 상태
                    enum:
                    - PENDING
                    - APPROVED
                    - REJECTED
                  fromStatus:
                    type: string
                    description: 변경 전 상태. 최초 신청이면 null
                    nullable: true
                    enum:
                    - PENDING
                    - APPROVED
                    - REJECTED
                  changedBy:
                    type: object
                    properties:
                      handle:
                        type: string
                        description: 상태를 변경한 관리자 handle
                        nullable: true
                      userId:
                        type: number
                        description: 상태를 변경한 관리자 사용자 ID
                        nullable: true
                    description: 상태를 변경한 관리자. 최초 신청이면 null
                  historyId:
                    type: number
                    description: 이력 ID
                  changedAt:
                    type: string
                    description: 상태 변경 시각(ISO-8601)
          description: 인증 신청 이력
        status:
          type: string
          description: 응답 상태
    AdminProjectMigrationUpdateSuccessResponse:
      title: AdminProjectMigrationUpdateSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - projectId
          - updatedAt
          - updatedFields
          type: object
          properties:
            updatedFields:
              type: array
              description: 수정한 필드명 목록
              items:
                type: string
            projectId:
              type: number
              description: 프로젝트 ID
            updatedAt:
              type: string
              description: 수정 시각
          description: 수정 결과
        status:
          type: string
          description: 응답 상태
    ProjectCommentCreateSuccessResponse:
      title: ProjectCommentCreateSuccessResponse
      required:
      - data
      - status
      type: object
      properties:
        data:
          required:
          - author
          - content
          - createdAt
          - editable
          - id
          - updatedAt
          type: object
          properties:
            createdAt:
              type: string
              description: 생성 시각 (UTC ISO-8601)
            editable:
              type: boolean
              description: 현재 사용자가 수정할 수 있는지 여부
            author:
              required:
              - displayName
              - userId
              type: object
              properties:
                avatarUrl:
                  type: string
                  description: 직접 업로드한 이미지가 없으면 GitHub 아바타를 사용하는 작성자 프로필 이미지 공개 URL
                  nullable: true
                displayName:
                  type: string
                  description: 작성자 표시 이름
                cohort:
                  type: number
                  description: 작성자 기수
                  nullable: true
                handle:
                  type: string
                  description: 작성자 handle
                  nullable: true
                userType:
                  type: string
                  description: 작성자 유형
                  nullable: true
                track:
                  type: string
                  description: 작성자 트랙
                  nullable: true
                userId:
                  type: number
                  description: 작성자 ID
              description: 댓글 작성자
            id:
              type: number
              description: 댓글 ID
            parentId:
              type: number
              description: 부모 댓글 ID
              nullable: true
            content:
              type: string
              description: 저장된 댓글 내용
            updatedAt:
              type: string
              description: 수정 시각 (UTC ISO-8601)
          description: 생성된 댓글
        status:

  /api/v1/projects/{projectId}/restore:
    post:
      tags:
      - Project
      summary: 프로젝트 복구
      description: "등록자 본인이 삭제한 자신의 프로젝트를 복구 기한 안에 되살린다. 승인 상태는 삭제 이전 값을 그대로 유지한다\
        . 로그인하지 않았으면 401, 없는 프로젝트이거나 등록자가 아니거나 삭제되지 않은 프로젝트이면 404, 복구 기한이 지났으면 409를\
        \ 반환한다. 복구 기한이 지난 프로젝트는 이후 영구 삭제되어 복구할 수 없다."
      operationId: project-restore
      parameters:
      - name: projectId
        in: path
        description: 복구할 프로젝트 ID
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectRestoreSuccessResponse"
              examples:
                project-restore:
                  value: "{\"status\":\"success\",\"data\":{\"id\":100,\"approvalStatus\"\
                    :\"APPROVED\",\"restoredAt\":\"2026-09-10T05:20:00Z\"}}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-restore-deadline-expired:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_RESTORE_DEADLINE_EXPIRED\"\
                    ,\"message\":\"복구 기한이 지나 프로젝트를 복구할 수 없습니다.\"}"
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-restore-not-found:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_NOT_FOUND\",\"\
                    message\":\"프로젝트를 찾을 수 없습니다.\"}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-restore-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"

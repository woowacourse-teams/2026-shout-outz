        schema:
          type: string
        example: JSESSIONID=session-id
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserCommentFindAllSuccessResponse"
              examples:
                user-comment-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"commentId\":11,\"type\"\
                    :\"FEED\",\"targetId\":101,\"content\":\"내가 작성한 댓글\",\"createdAt\"\
                    :\"2026-09-16T00:00:00Z\",\"updatedAt\":\"2026-09-16T00:05:00Z\"\
                    },{\"commentId\":12,\"type\":\"PROJECT\",\"targetId\":202,\"content\"\

                  value: "{\"status\":\"success\",\"data\":{\"projectId\":100,\"approvalStatus\"\
                    :\"PENDING\"}}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:

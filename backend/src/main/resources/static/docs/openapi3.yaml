openapi: 3.0.1
info:
  title: Shout-outz API
  description: Shout-outz Backend API
  version: 0.0.1-SNAPSHOT
servers:
- url: http://localhost:8080
tags: []
paths:
  /api/v1/categories:
    get:
      tags:
      - Category
      summary: 카테고리 목록 조회
      description: 피드 작성에 사용할 활성 카테고리를 표시 순서대로 조회한다.
      operationId: category-find-all
      parameters:
      - name: feedType
        in: query
        description: 카테고리를 사용할 피드 유형(QUESTION 또는 POST). 생략하면 전체 유형 조회
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryFindAllSuccessResponse"
              examples:
                category-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"categoryId\":1,\"slug\"\
                    :\"backend\",\"displayName\":\"백엔드\",\"type\":\"GENERAL\",\"feedType\"\
                    :\"POST\",\"displayOrder\":1},{\"categoryId\":2,\"slug\":\"tecode-talk\"\
                    ,\"displayName\":\"테코드톡\",\"type\":\"EVENT\",\"feedType\":\"POST\"\
                    ,\"displayOrder\":2}]}"
    post:
      tags:
      - Category
      summary: 카테고리 생성
      description: 관리자가 일반 또는 이벤트 카테고리를 생성한다.
      operationId: category-save
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/CategorySaveRequest"
            examples:
              category-save-unauthorized:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "feedType": "POST",
                    "displayOrder": 1
                  }
              category-save-invalid:
                value: |
                  {
                    "slug": "Backend!",
                    "displayName": " ",
                    "displayOrder": -1
                  }
              category-save-conflict:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "feedType": "POST",
                    "displayOrder": 1
                  }
              category-save-forbidden:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "feedType": "POST",
                    "displayOrder": 1
                  }
              category-save:
                value: |
                  {
                    "slug": "backend",
                    "displayName": "백엔드",
                    "type": "GENERAL",
                    "feedType": "POST",
                    "displayOrder": 1
                  }
      responses:
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"displayOrder\"\
                    ,\"message\":\"displayOrder는 0 이상이어야 합니다.\"},{\"field\":\"slug\"\
                    ,\"message\":\"slug 형식이 올바르지 않습니다.\"},{\"field\":\"type\",\"message\"\
                    :\"type은 필수입니다.\"},{\"field\":\"displayName\",\"message\":\"displayName은\
                    \ 필수입니다.\"},{\"field\":\"feedType\",\"message\":\"feedType은 필수\
                    입니다.\"}]}"
        "409":
          description: "409"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-conflict:
                  value: "{\"status\":\"error\",\"code\":\"CATEGORY_ALREADY_EXISTS\"\
                    ,\"message\":\"이미 존재하는 slug 또는 표시 이름입니다.\"}"
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                category-save-forbidden:
                  value: "{\"status\":\"error\",\"code\":\"CATEGORY_ADMIN_FORBIDDEN\"\
                    ,\"message\":\"관리자만 카테고리를 변경할 수 있습니다.\"}"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategorySaveSuccessResponse"
              examples:
                category-save:
                  value: "{\"status\":\"success\",\"data\":{\"categoryId\":1,\"slug\"\
                    :\"backend\",\"displayName\":\"백엔드\",\"type\":\"GENERAL\",\"feedType\"\
                    :\"POST\",\"displayOrder\":1,\"active\":true}}"
  /api/v1/cohorts:
    get:
      tags:
      - Cohort
      summary: 기수 선택지 조회
      description: 우아한테크코스 기수와 진행 연도를 최신 기수부터 반환한다.
      operationId: cohort-find-all
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CohortFindAllSuccessResponse"
              examples:
                cohort-find-all:
                  value: "{\"status\":\"success\",\"data\":{\"items\":[{\"cohort\"\
                    :8,\"year\":2026},{\"cohort\":7,\"year\":2025},{\"cohort\":6,\"\
                    year\":2024},{\"cohort\":5,\"year\":2023},{\"cohort\":4,\"year\"\
                    :2022},{\"cohort\":3,\"year\":2021},{\"cohort\":2,\"year\":2020},{\"\
                    cohort\":1,\"year\":2019}]}}"
  /api/v1/feeds:
    get:
      tags:
      - Feed
      summary: 피드 목록 조회
      description: "전체 공개 피드를 최신순, 인기순, 답변 대기 또는 키워드 정확도순 Slice로 조회한다."
      operationId: feed-find-all
      parameters:
      - name: sort
        in: query
        description: "LATEST, POPULAR, WAITING 또는 RELEVANCE. 검색어가 없으면 기본 LATEST, 있\
          으면 기본 RELEVANCE"
        required: false
        schema:
          type: string
      - name: type
        in: query
        description: QUESTION 또는 POST. 생략하면 전체 유형 조회
        required: false
        schema:
          type: string
      - name: categoryId
        in: query
        description: 카테고리 ID
        required: false
        schema:
          type: integer
          format: int32
      - name: keyword
        in: query
        description: 제목과 본문 검색어(Unicode 최대 100자)
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "같은 검색어, 카테고리, 정렬 조건의 다음 Slice 커서"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 크기(기본 20, 최대 100)"
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-find-all-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"sort\",\"\
                    message\":\"Failed to convert value of type 'java.lang.String'\
                    \ to required type 'com.shoutoutz.api.feed.application.dto.FeedSort';\
                    \ Failed to convert from type [java.lang.String] to type [com.shoutoutz.api.feed.application.dto.FeedSort]\
                    \ for value [INVALID]\"}]}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedFindAllSuccessResponse"
              examples:
                feed-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"feedId\":10,\"feedType\"\
                    :\"POST\",\"title\":\"피드 제목\",\"content\":\"본문입니다. https://example.com/article\"\
                    ,\"isAnonymous\":false,\"author\":{\"userId\":1,\"handle\":\"\
                    @zzaekkii\",\"displayName\":\"재키\",\"userType\":\"WOOWACOURSE_CREW\"\
                    ,\"track\":\"BACKEND\",\"isCurrent\":true,\"avatarImageId\":21,\"\
                    avatarUrl\":\"https://cdn.example.com/media/21/display\"},\"categories\"\
                    :[{\"categoryId\":3,\"slug\":\"backend\",\"displayName\":\"백엔드\
                    \",\"feedType\":\"POST\",\"type\":\"GENERAL\"}],\"media\":[{\"\
                    mediaId\":21,\"url\":\"https://cdn.example.com/media/21/display\"\
                    ,\"displayOrder\":0}],\"linkPreview\":{\"url\":\"https://example.com/article\"\
                    ,\"title\":\"글 제목\",\"description\":\"글 설명\",\"imageUrl\":\"https://example.com/image.png\"\
                    ,\"siteName\":\"Example\"},\"likeCount\":0,\"bookmarkCount\":0,\"\
                    likedByMe\":false,\"bookmarkedByMe\":false,\"commentCount\":0,\"\
                    createdAt\":\"2026-09-11T00:00:00Z\",\"updatedAt\":\"2026-09-11T00:00:00Z\"\
                    }],\"meta\":{\"nextCursor\":\"next-cursor\",\"hasNext\":true,\"\
                    totalCount\":12}}"
    post:
      tags:
      - Feed
      summary: 피드 작성
      description: 로그인 사용자가 카테고리와 업로드 완료된 본문 이미지를 연결해 피드를 작성한다.
      operationId: feed-save
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema:
              $ref: "#/components/schemas/FeedSaveRequest"
            examples:
              feed-save-forbidden:
                value: |
                  {"title":"피드 제목","content":"본문","categoryIds":[1],"mediaIds":[]}
              feed-save-invalid:
                value: |
                  {"title":"제목","content":"   ","categoryIds":[1],"mediaIds":[]}
              feed-save-unauthorized:
                value: |
                  {"title":"피드 제목","content":"본문","categoryIds":[1],"mediaIds":[]}
              feed-save:
                value: |
                  {
                    "title": "피드 제목",
                    "content": "본문입니다.",
                    "categoryIds": [3],
                    "mediaIds": [21]
                  }
      responses:
        "403":
          description: "403"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-save-forbidden:
                  value: "{\"status\":\"error\",\"code\":\"FEED_WRITER_FORBIDDEN\"\
                    ,\"message\":\"피드를 작성할 수 없는 사용자입니다.\"}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-save-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"content\"\
                    ,\"message\":\"content는 필수입니다.\"}]}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                feed-save-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
        "201":
          description: "201"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedSaveSuccessResponse"
              examples:
                feed-save:
                  value: "{\"status\":\"success\",\"data\":{\"feedId\":10,\"feedType\"\
                    :\"POST\",\"title\":\"피드 제목\",\"content\":\"본문입니다. https://example.com/article\"\
                    ,\"isAnonymous\":false,\"author\":{\"userId\":1,\"handle\":\"\
                    @zzaekkii\",\"displayName\":\"재키\",\"userType\":\"WOOWACOURSE_CREW\"\
                    ,\"track\":\"BACKEND\",\"isCurrent\":true,\"avatarUrl\":\"https://cdn.example.com/media/21/display\"\
                    },\"categories\":[{\"categoryId\":3,\"slug\":\"backend\",\"displayName\"\
                    :\"백엔드\",\"feedType\":\"POST\",\"type\":\"GENERAL\"}],\"media\"\
                    :[{\"url\":\"https://cdn.example.com/media/21/display\",\"displayOrder\"\
                    :0}],\"linkPreview\":{\"url\":\"https://example.com/article\"\
                    ,\"title\":\"글 제목\",\"description\":\"글 설명\",\"imageUrl\":\"https://example.com/image.png\"\
                    ,\"siteName\":\"Example\"},\"createdAt\":\"2026-09-11T00:00:00Z\"\
                    ,\"updatedAt\":\"2026-09-11T00:00:00Z\"}}"
  /api/v1/news:
    get:
      tags:
      - News
      summary: 소식 목록 조회
      description: 소식 목록을 유형과 이벤트 상태로 필터링하고 최신순으로 조회한다.
      operationId: news-find-all
      parameters:
      - name: type
        in: query
        description: "소식 유형(ALL, NOTICE, EVENT). 기본값은 ALL"
        required: false
        schema:
          type: string
      - name: eventStatus
        in: query
        description: "이벤트 상태(UPCOMING, ONGOING, ENDED)"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: 정렬 기준. 현재 LATEST만 지원하며 기본값은 LATEST
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 개수. 기본값 20, 최댓값 50"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: 다음 페이지 조회에 사용하는 opaque cursor
        required: false
        schema:
          type: string
      responses:
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                news-find-all-filter-combination-invalid-notice-ended:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-upcoming:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-notice-ongoing:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-ongoing:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-all-ended:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
                news-find-all-filter-combination-invalid-notice-upcoming:
                  value: "{\"status\":\"error\",\"code\":\"NEWS_EVENT_STATUS_REQUIRES_EVENT_TYPE\"\
                    ,\"message\":\"이벤트 상태 필터는 EVENT 유형에서만 사용할 수 있습니다.\"}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsFindAllSuccessResponse"
              examples:
                news-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"id\":102,\"type\":\"\
                    EVENT\",\"title\":\"프로젝트 아카이빙 챌린지\",\"summary\":\"팀 프로젝트를 등록하고\
                    \ 피드백을 받아보세요.\",\"publishedAt\":\"2026-08-25T00:00:00Z\",\"eventStatus\"\
                    :\"ONGOING\",\"eventStartAt\":\"2026-08-20T00:00:00Z\",\"eventEndAt\"\
                    :\"2026-09-20T14:59:59Z\",\"isPinned\":false,\"pinOrder\":null,\"\
                    likeCount\":0,\"likedByMe\":false}],\"meta\":{\"nextCursor\":null,\"\
                    hasNext\":false,\"totalCount\":1}}"
  /api/v1/notifications:
    get:
      tags:
      - Notification
      summary: 알림 목록 조회
      description: 현재 로그인 사용자의 알림을 최신순으로 조회한다.
      operationId: notification-list
      parameters:
      - name: cursor
        in: query
        description: 다음 페이지 조회용 커서. 첫 요청은 생략
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "조회 개수. 기본값 20, 1~50"
        required: false
        schema:
          type: integer
          format: int32
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListSuccessResponse"
              examples:
                notification-list:
                  value: "{\"status\":\"success\",\"data\":[{\"notificationId\":100,\"\
                    notificationType\":\"QUESTION_ACTIVITY\",\"message\":\"새로운 답변이\
                    \ 달렸어요.\",\"feedId\":10,\"feedTitle\":\"질문 제목\",\"commentId\"\
                    :20,\"actor\":{\"userId\":30,\"handle\":\"@actor\",\"displayName\"\
                    :\"작성자\",\"avatarUrl\":null},\"isRead\":false,\"createdAt\":\"\
                    2026-09-30T00:00:00Z\"}],\"meta\":{\"nextCursor\":null,\"hasNext\"\
                    :false,\"totalCount\":1}}"
  /api/v1/projects:
    get:
      tags:
      - Project
      summary: 프로젝트 목록 조회
      description: "승인된 프로젝트 목록을 검색어, 기수, 기술 스택으로 걸러 정렬 기준대로 조회한다. 로그인하지 않아도 조회할 수\
        \ 있다. 커서 기반으로, 첫 요청은 cursor를 생략하고 다음 요청부터 응답의 meta.nextCursor를 그대로 전달한다. 정\
        렬을 바꾸면 cursor 없이 처음부터 다시 요청한다. POPULAR에서 좋아요 수가 같으면 최근 등록된 프로젝트가 앞에 온다. 요청\
        \ 형식이 올바르지 않거나, 정의되지 않은 기수이거나, 커서가 올바르지 않으면 400을 반환한다."
      operationId: project-find-all
      parameters:
      - name: keyword
        in: query
        description: "프로젝트 이름, 한 줄 소개, 참여 크루 이름, 기술 스택 이름 검색어. 대소문자를 무시한 부분 일치이며 100자\
          \ 이하"
        required: false
        schema:
          type: string
      - name: cohorts
        in: query
        description: "기수 필터. 쉼표로 구분 (ex. 6,7). 선택한 기수 중 하나에 해당하면 조회"
        required: false
        schema:
          type: string
      - name: techTagIds
        in: query
        description: "기술 스택 필터. 쉼표로 구분 (ex. 1,2,3). 선택한 기술 스택을 모두 사용한 프로젝트만 조회"
        required: false
        schema:
          type: string
      - name: sort
        in: query
        description: "정렬 기준 (LATEST, POPULAR). 기본값 LATEST"
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: "한 번에 가져올 프로젝트 수. 기본값 8, 1~50"
        required: false
        schema:
          type: string
      - name: cursor
        in: query
        description: "다음 페이지 조회용 커서. 첫 요청은 생략하고, 이후 응답의 meta.nextCursor를 그대로 전달"
        required: false
        schema:
          type: string
      responses:
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectFindAllSuccessResponse"
              examples:
                project-find-all:
                  value: "{\"status\":\"success\",\"data\":[{\"slug\":\"loop\",\"\
                    title\":\"루프 (Loop)\",\"tagline\":\"스프린트 회고와 액션 아이템을 하나로 엮은 실시\
                    간 협업 도구\",\"cohort\":6,\"thumbnailImageId\":12,\"thumbnailUrl\"\
                    :\"https://cdn.example.com/display\",\"starCount\":128,\"likeCount\"\
                    :184,\"commentCount\":14,\"bookmarkCount\":0,\"likedByMe\":false,\"\
                    bookmarkedByMe\":false,\"techTags\":[{\"id\":1,\"displayName\"\
                    :\"React\"},{\"id\":2,\"displayName\":\"Spring\"}],\"members\"\
                    :[{\"userId\":7,\"handle\":\"@dhyepark\",\"displayName\":\"박다혜\
                    \",\"userType\":\"WOOWACOURSE_CREW\",\"cohort\":6,\"track\":\"\
                    BACKEND\",\"avatarUrl\":\"https://cdn.example.com/avatar-101\"\
                    ,\"githubProfileUrl\":null},{\"userId\":null,\"handle\":null,\"\
                    displayName\":\"Archived Crew\",\"userType\":null,\"cohort\":null,\"\

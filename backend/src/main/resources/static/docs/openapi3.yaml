                user-profile-update:
                  value: "{\"status\":\"success\",\"data\":{\"handle\":\"zzaekkii\"\
                    ,\"displayName\":\"재키\",\"userType\":\"WOOWACOURSE_CREW\",\"track\"\
                    :\"BACKEND\",\"cohort\":8,\"bio\":\"백엔드 개발자입니다.\",\"avatarUrl\"\
                    :\"https://cdn.example.com/media/21/display\",\"githubProfileUrl\"\
                    :\"https://github.com/zzaekkii\",\"blogUrl\":\"https://zzaekkii.dev\"\
                    }}"
        "400":
          description: "400"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                user-profile-update-invalid:
                  value: "{\"status\":\"error\",\"code\":\"VALIDATION_FAILED\",\"\
                    message\":\"입력값을 확인해주세요.\",\"details\":[{\"field\":\"githubProfileUrl\"\
                    ,\"message\":\"githubProfileUrl 형식이 올바르지 않습니다.\"},{\"field\":\"\
                    blogUrl\",\"message\":\"blogUrl 형식이 올바르지 않습니다.\"}]}"
                user-profile-update-display-name-immutable:
                  value: "{\"status\":\"error\",\"code\":\"PROFILE_DISPLAY_NAME_IMMUTABLE\"\
                    ,\"message\":\"인증된 우아한테크코스 사용자는 표시 이름을 변경할 수 없습니다.\"}"
                user-profile-update-avatar-invalid-purpose:

                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
    delete:
      tags:
      - Project
      summary: 프로젝트 삭제
      description: "등록자 본인이 자신의 프로젝트를 삭제한다. 심사 중인 프로젝트도 삭제할 수 있다. 삭제된 프로젝트는 목록과 상세\
        에서 보이지 않으며, 응답의 restoreDeadlineAt 까지 복구할 수 있다. 로그인하지 않았으면 401, 없는 프로젝트이거나\
        \ 등록자가 아니거나 이미 삭제된 프로젝트이면 404를 반환한다."
      operationId: project-delete
      parameters:
      - name: projectId
        in: path
        description: 삭제할 프로젝트 ID
        required: true
        schema:
          type: string
      - name: X-CSRF-Token
        in: header
        description: 세션 조회로 발급받은 CSRF 토큰
        required: true
        schema:
          type: string
        example: csrf-token
      responses:
        "404":
          description: "404"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-delete-not-found:
                  value: "{\"status\":\"error\",\"code\":\"PROJECT_NOT_FOUND\",\"\
                    message\":\"프로젝트를 찾을 수 없습니다.\"}"
        "401":
          description: "401"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                project-delete-unauthorized:
                  value: "{\"status\":\"error\",\"code\":\"UNAUTHORIZED\",\"message\"\
                    :\"인증이 필요합니다.\"}"
        "200":
          description: "200"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectDeleteSuccessResponse"
              examples:
                project-delete:
                  value: "{\"status\":\"success\",\"data\":{\"id\":100,\"deletedAt\"\
                    :\"2026-09-06T13:30:00Z\",\"restoreDeadlineAt\":\"2026-10-06T13:30:00Z\"\
                    }}"

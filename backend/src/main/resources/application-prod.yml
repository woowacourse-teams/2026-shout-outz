spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
# Spring Boot의 기본 에러 응답에 민감한 정보를 포함하지 않도록 설정
  web:
    error:
      include-message: never
      include-stacktrace: never
      include-binding-errors: never

# 콘솔(journald) 출력은 유지하고, CloudWatch Agent가 수집할 수 있도록 파일에도 남긴다.
# 장기 보관은 CloudWatch가 맡으므로, 서버에는 디스크를 압박하지 않을 만큼만 보관한다.
logging:
  file:
    name: /var/log/shout-outz/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

# Actuator는 서비스 포트와 분리해 루프백에만 연다. nginx는 8080만 넘기므로 외부에서 지표에 닿을 수 없다.
# 보안 그룹은 공용이라 수정할 수 없으므로, address를 빠뜨리면 8081이 모든 인터페이스에 열린다.
management:
  server:
    port: 8081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,prometheus

visitor:
  cookie-secure: ${SESSION_COOKIE_SECURE:true}
  cookie-same-site: ${SESSION_COOKIE_SAME_SITE:None}

server:
  # 외부 요청은 nginx가 받으므로, 애플리케이션은 루프백에만 열어 직접 접근을 막는다.
  address: 127.0.0.1
  # 프록시가 전달하는 X-Forwarded-* 헤더를 신뢰해 원래 요청의 스킴과 호스트를 인식한다.
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: ${SESSION_COOKIE_SECURE:true}
        same-site: ${SESSION_COOKIE_SAME_SITE:None}

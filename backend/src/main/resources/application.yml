spring:
  application:
    name: shout-outz
  profiles:
    # 명시적인 프로필이 없을 때 local을 사용함.
    # 운영에서는 SPRING_PROFILES_ACTIVE=prod를 지정함.
    default: local
  jpa:
    hibernate:
      ddl-auto: none
    # 서비스 트랜잭션 범위에서만 JPA 영속성 컨텍스트를 유지하기 위함.
    open-in-view: false
  flyway:
    postgresql:
      transactional-lock: false
logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    key-prefix: ${AWS_S3_KEY_PREFIX}
    presigned-url-expiration-seconds: ${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
    connect-timeout: ${GITHUB_OAUTH_CONNECT_TIMEOUT:3s}
    read-timeout: ${GITHUB_OAUTH_READ_TIMEOUT:5s}

auth:
  oauth:
    completion-uri: ${FRONTEND_OAUTH_COMPLETION_URI:http://localhost:5173}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 방문자 식별 쿠키 속성은 세션 쿠키와 맞춘다.
visitor:
  cookie-name: VISITOR_ID
  cookie-max-age: ${VISITOR_COOKIE_MAX_AGE:365d}
  cookie-secure: ${SESSION_COOKIE_SECURE:false}
  cookie-same-site: Lax
  hash-secret: ${VISITOR_HASH_SECRET}

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: lax

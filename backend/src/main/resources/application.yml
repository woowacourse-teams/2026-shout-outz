spring:
  application:
    name: dropit-backend
  datasource:
    url: ${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/dropit}
    username: ${SUPABASE_DB_USERNAME:postgres}
    password: ${SUPABASE_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:3000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: public
  flyway:
    enabled: false
  threads:
    virtual:
      enabled: ${VIRTUAL_THREADS_ENABLED:false}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

supabase:
  url: ${SUPABASE_URL:}
  jwt:
    issuer: ${SUPABASE_JWT_ISSUER:}
    jwk-set-uri: ${SUPABASE_JWT_JWK_SET_URI:}
    secret: ${SUPABASE_JWT_SECRET:}

dropit:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

springdoc:
  api-docs:
    path: /v1/openapi.json
  swagger-ui:
    path: /v1/swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

spring:
  application:
    name: shout-outz
  profiles:
    # 명시적인 프로필이 없을 때 local을 사용함.
    # 운영에서는 SPRING_PROFILES_ACTIVE=prod를 지정함.
    default: local
  jpa:
    hibernate:
      ddl-auto: none
    # 서비스 트랜잭션 범위에서만 JPA 영속성 컨텍스트를 유지하기 위함.
    open-in-view: false
  flyway:
    postgresql:
      transactional-lock: false
logging:
  pattern:
    level: "%5p [traceId:%X{traceId}]"

aws:
  s3:
    bucket: ${AWS_S3_BUCKET}
    region: ${AWS_REGION}
    key-prefix: ${AWS_S3_KEY_PREFIX}
    presigned-url-expiration-seconds: ${AWS_S3_PRESIGNED_URL_EXPIRATION_SECONDS}
  cloudfront:
    public-base-url: ${AWS_CLOUDFRONT_PUBLIC_BASE_URL}

question-recommendation:
  count: ${QUESTION_RECOMMENDATION_COUNT:5}
  max-generation-attempts: ${QUESTION_RECOMMENDATION_MAX_GENERATION_ATTEMPTS:5}
  max-outbox-attempts: ${QUESTION_RECOMMENDATION_MAX_OUTBOX_ATTEMPTS:5}
  outbox-poll-interval-millis: ${QUESTION_RECOMMENDATION_OUTBOX_POLL_INTERVAL_MILLIS:5000}
  outbox-initial-delay-millis: ${QUESTION_RECOMMENDATION_OUTBOX_INITIAL_DELAY_MILLIS:1000}
  fallback-enabled: ${QUESTION_RECOMMENDATION_FALLBACK_ENABLED:true}
  sqs:
    enabled: ${QUESTION_RECOMMENDATION_SQS_ENABLED:false}
    queue-url: ${QUESTION_RECOMMENDATION_QUEUE_URL:}
    dead-letter-queue-url: ${QUESTION_RECOMMENDATION_DLQ_URL:}
    region: ${AWS_REGION}
    poll-interval-millis: ${QUESTION_RECOMMENDATION_SQS_POLL_INTERVAL_MILLIS:1000}
    max-messages-per-poll: ${QUESTION_RECOMMENDATION_SQS_MAX_MESSAGES_PER_POLL:1}
    visibility-timeout: ${QUESTION_RECOMMENDATION_SQS_VISIBILITY_TIMEOUT:3m}

llm:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    connect-timeout: ${GEMINI_CONNECT_TIMEOUT:5s}
    read-timeout: ${GEMINI_READ_TIMEOUT:45s}
  openai:
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-6-luna}
    connect-timeout: ${OPENAI_CONNECT_TIMEOUT:5s}
    read-timeout: ${OPENAI_READ_TIMEOUT:45s}
    reasoning-effort: ${OPENAI_REASONING_EFFORT:none}

# 선배 기록 검색의 문서 조각과 질문을 같은 모델, 차원, 정규화로 임베딩하기 위함.
# 임베딩 전용 키를 쓴다(질문 추천 LLM 키와 분리, 월 사용 한도 설정).
resource:
  embedding:
    provider: ${RESOURCE_EMBEDDING_PROVIDER:openai}
    model-id: ${RESOURCE_EMBEDDING_MODEL_ID:text-embedding-3-small}
    dimensions: ${RESOURCE_EMBEDDING_DIMENSIONS:1024}
    normalize: ${RESOURCE_EMBEDDING_NORMALIZE:true}
    api-key: ${RESOURCE_EMBEDDING_API_KEY:}
    connect-timeout: ${RESOURCE_EMBEDDING_CONNECT_TIMEOUT:5s}
    read-timeout: ${RESOURCE_EMBEDDING_READ_TIMEOUT:30s}

github:
  oauth:
    client-id: ${GITHUB_OAUTH_CLIENT_ID}
    client-secret: ${GITHUB_OAUTH_CLIENT_SECRET}
    redirect-uri: ${GITHUB_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/github}
    connect-timeout: ${GITHUB_OAUTH_CONNECT_TIMEOUT:3s}
    read-timeout: ${GITHUB_OAUTH_READ_TIMEOUT:5s}

auth:
  oauth:
    completion-uri: ${FRONTEND_OAUTH_COMPLETION_URI:http://localhost:5173}
    allowed-completion-uris: ${FRONTEND_OAUTH_ALLOWED_COMPLETION_URIS:http://localhost:5173}

cors:
  allowed-origin-patterns: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# 방문자 식별 쿠키 속성은 세션 쿠키와 맞춘다.
visitor:
  cookie-name: VISITOR_ID
  cookie-max-age: ${VISITOR_COOKIE_MAX_AGE:365d}
  cookie-secure: ${SESSION_COOKIE_SECURE:false}
  cookie-same-site: ${SESSION_COOKIE_SAME_SITE:Lax}
  hash-secret: ${VISITOR_HASH_SECRET}

server:
  servlet:
    session:
      timeout: ${SESSION_TIMEOUT:30m}
      cookie:
        http-only: true
        secure: ${SESSION_COOKIE_SECURE:false}
        same-site: ${SESSION_COOKIE_SAME_SITE:Lax}

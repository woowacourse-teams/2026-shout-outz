# 요청의 X-Trace-Id가 애플리케이션과 같은 규칙에 맞으면 그대로 쓰고, 아니면 nginx가 만든 ID를 쓴다.
# 같은 규칙이어야 애플리케이션이 값을 바꾸지 않아 nginx 로그와 애플리케이션 로그가 같은 ID로 이어진다.
map $http_x_trace_id $shoutoutz_trace_id {
    "~^[A-Za-z0-9_-]{1,64}$" $http_x_trace_id;
    default                  $request_id;
}

# 쿼리 스트링(OAuth code 등)이 남지 않도록 $request_uri 대신 $uri를 쓰고, Referer는 남기지 않는다.
log_format shoutoutz_json escape=json
    '{"time":"$time_iso8601",'
    '"trace_id":"$shoutoutz_trace_id",'
    '"remote_addr":"$remote_addr",'
    '"host":"$host",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"status":$status,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"upstream_connect_time":"$upstream_connect_time",'
    '"bytes_sent":$body_bytes_sent,'
    '"user_agent":"$http_user_agent"}';

server {
    server_name api.shout-ou.tz;

    client_max_body_size 10m;

    access_log /var/log/nginx/shout-outz-access.log shoutoutz_json;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header X-Trace-Id        $shoutoutz_trace_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/api.shout-ou.tz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/api.shout-ou.tz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = api.shout-ou.tz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name api.shout-ou.tz;
    return 404; # managed by Certbot


}

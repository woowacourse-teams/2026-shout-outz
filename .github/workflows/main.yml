name: Build and Push to Private Repo

on:
  push:
    branches:
      - main
      - fe-infra-10-cd

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Debug SSH key
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          echo "바이트 수: $(wc -c < ~/.ssh/id_ed25519)"
          echo "줄 수: $(wc -l < ~/.ssh/id_ed25519)"
          head -c 40 ~/.ssh/id_ed25519
          echo

          ssh-keygen -y -f ~/.ssh/id_ed25519 > /dev/null \
            && echo "키 정상" \
            || echo "키 손상"

      - name: Push build to private repo
        env:
          DEPLOY_KEY: ${{ secrets.PRIVATE_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan github.com >> ~/.ssh/known_hosts

          git clone \
            git@github.com:shout-outz/drop-it-deploy-workflow.git \
            deploy-repo

          rm -rf deploy-repo/*

          cp -R dist/. deploy-repo/

          cd deploy-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add -A
          git commit -m "Deploy ${GITHUB_SHA}" || exit 0
          git push

name: Deploy to S3 via EC2

on:
  push:
    branches: [main, fe-infra-10-cd]
  workflow_dispatch:

# 같은 브랜치의 이전 배포가 진행 중이면 취소한다.
# 배포는 순서가 뒤집히면 구버전이 최종본이 되는 사고가 나므로 동시 실행을 막는다.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BUILD_DIR: dist
  STAGING_DIR: /home/deploy/staging

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          set -euo pipefail
          test -d "${BUILD_DIR}" || { echo "빌드 디렉터리 없음: ${BUILD_DIR}"; exit 1; }
          test -f "${BUILD_DIR}/index.html" || { echo "index.html 없음"; exit 1; }
          echo "--- build output ---"
          ls -la "${BUILD_DIR}"

      - name: Setup SSH
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # 키가 정상 로드되는지 먼저 확인 (형식 오류를 여기서 잡는다)
          ssh-keygen -y -f ~/.ssh/deploy_key > /dev/null

      - name: Upload build output to EC2 (rsync)
        run: |
          set -euo pipefail
          rsync -az --delete --stats \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes" \
            "${BUILD_DIR}/" \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${STAGING_DIR}/"

      - name: Sync to S3 and invalidate CloudFront
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "STAGING_DIR='${STAGING_DIR}' \
             S3_BUCKET='${{ secrets.S3_BUCKET }}' \
             CF_DISTRIBUTION_ID='${{ secrets.CF_DISTRIBUTION_ID }}' \
             bash -s" <<'REMOTE'
          set -euo pipefail
          export AWS_PAGER=""

          echo "=== [1/3] 해시 자산 업로드 (장기 캐시) ==="
          # HTML보다 자산을 먼저 올린다.
          # 순서가 반대면, 새 HTML이 아직 존재하지 않는 자산을 참조하는 순간이 생긴다.
          # --delete 없음: 구버전 페이지를 열어둔 사용자가 참조 중인 자산을 지우지 않기 위함.
          aws s3 sync "${STAGING_DIR}/" "s3://${S3_BUCKET}/" \
            --exclude "*.html" \
            --exclude "*.json" \
            --cache-control "public, max-age=31536000, immutable" \
            --only-show-errors

          echo "=== [2/3] HTML 업로드 (캐시 금지) ==="
          # 이 sync가 실제 '배포 전환' 시점이다.
          # --delete는 필터 대상(HTML)에만 적용되므로 삭제된 페이지만 정리된다.
          aws s3 sync "${STAGING_DIR}/" "s3://${S3_BUCKET}/" \
            --exclude "*" \
            --include "*.html" \
            --include "*.json" \
            --cache-control "no-cache, must-revalidate" \
            --delete \
            --only-show-errors

          echo "=== [3/3] CloudFront 무효화 ==="
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id "${CF_DISTRIBUTION_ID}" \
            --paths "/*" \
            --query "Invalidation.Id" \
            --output text)
          echo "무효화 생성됨: ${INVALIDATION_ID}"
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/deploy_key

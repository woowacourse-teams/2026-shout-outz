name: Frontend CI

# frontend를 바꾸는 PR은 타입 검사와 린트를 통과해야 병합할 수 있다.
# 브랜치 보호 규칙의 필수 검사로 `Frontend CI / check`를 등록한다.

on:
  pull_request:
    branches:
      - develop
      - main
    paths:
      - frontend/**
      - .github/workflows/frontend-ci.yml

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

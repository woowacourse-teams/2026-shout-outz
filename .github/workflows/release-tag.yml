name: Create Release Tag

# main에 머지된 PR 제목의 [파트/작업 종류] 태그로 다음 버전을 계산해 태그와 GitHub Release를 만든다.
# 버전 규칙은 docs/릴리스규칙.md를 따른다.
#
# 최신 태그 v0.1.0 기준
#   [ALL/feat!] ... → v1.0.0
#   [ALL/feat]  ... → v0.2.0
#   [ALL/fix]   ... → v0.1.1
# 첫 릴리스는 저장소에 v* 태그가 아직 없으므로 작업 종류와 관계없이 v0.1.0

on:
  pull_request:
    types:
      - closed
    branches:
      - main

concurrency:
  group: release-tag
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  tag:
    # 머지 없이 닫힌 PR은 무시한다.
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          # PR 제목은 사용자 입력이므로 스크립트에 직접 넣지 않고 환경 변수로 전달한다.
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail

          if [[ ! "$PR_TITLE" =~ ^\[[A-Za-z]+/([A-Za-z]+)(!?)\] ]]; then
            echo "::error::PR 제목에 [파트/작업 종류] 태그가 없습니다: $PR_TITLE"
            echo "::error::docs/릴리스규칙.md의 '태그가 만들어지지 않았을 때'를 참고해 직접 태그를 만드세요"
            exit 1
          fi
          TYPE="$(printf '%s' "${BASH_REMATCH[1]}" | tr '[:upper:]' '[:lower:]')"
          BREAKING="${BASH_REMATCH[2]}"

          LATEST="$(gh api --paginate "repos/$GITHUB_REPOSITORY/tags" --jq '.[].name' \
            | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)"

          if [ -z "$LATEST" ]; then
            TAG="v0.1.0"
          else
            IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST#v}"

            if [ -n "$BREAKING" ]; then
              TAG="v$((MAJOR + 1)).0.0"
            elif [ "$TYPE" = "feat" ] || [ "$TYPE" = "feature" ]; then
              TAG="v${MAJOR}.$((MINOR + 1)).0"
            else
              TAG="v${MAJOR}.${MINOR}.$((PATCH + 1))"
            fi
          fi

          echo "[$TYPE$BREAKING] ${LATEST:-없음} → $TAG"

          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$MERGE_SHA" \
            --title "$TAG" \
            --generate-notes

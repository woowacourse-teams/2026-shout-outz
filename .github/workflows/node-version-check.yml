name: Node Version Check

on:
  push:
    paths:
      - 'frontend/.nvmrc'
      - 'frontend/package.json'
      - '.github/workflows/node-version-check.yml'
  workflow_dispatch:

concurrency:
  group: node-version-check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify .nvmrc matches engines.node
        working-directory: frontend
        run: |
          set -euo pipefail

          version=$(tr -d '[:space:]' < .nvmrc)
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=frontend/.nvmrc::\"${version}\"은 정확한 버전이 아닙니다. 예: 24.20.0"
            exit 1
          fi

          range=$(jq -r '.engines.node' package.json)
          if ! printf '%s' "$range" | grep -qE '^(>=|\^|~)?[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error file=frontend/package.json::engines.node(\"${range}\")는 '>=', '^', '~' 중 하나 또는 연산자 없이 정확한 버전이어야 합니다. 예: >=24.20.0"
            exit 1
          fi

          base=$(printf '%s' "$range" | sed -E 's/^(>=|\^|~)//')
          if [ "$base" != "$version" ]; then
            echo "::error file=frontend/package.json::.nvmrc(${version})와 engines.node(${range})가 서로 다른 버전을 가리킵니다. 두 파일을 같이 맞춰주세요."
            exit 1
          fi

          echo ".nvmrc ${version} / engines.node ${range} — 버전 일치"

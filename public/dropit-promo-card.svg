<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="leftShade" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F18" stop-opacity="0.97"/>
      <stop offset="0.58" stop-color="#0B0F18" stop-opacity="0.74"/>
      <stop offset="1" stop-color="#0B0F18" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="58" y1="542" x2="360" y2="530" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2D8CFF"/>
      <stop offset="1" stop-color="#6D7BFF"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <image x="0" y="0" width="1200" height="630" preserveAspectRatio="xMidYMid slice" xlink:href="./dropit-promo-background.png"/>
  <rect width="1200" height="630" fill="url(#leftShade)"/>

  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <g transform="translate(76 72)">
      <rect width="28" height="28" rx="9" fill="#2D8CFF"/>
      <path d="M8.5 13.5 14 19l7-10" stroke="#0B0F18" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="20" fill="#F5F7FA" font-size="18" font-weight="700" letter-spacing="-0.04em">dropit.</text>
    </g>

    <text x="80" y="178" fill="#9BA4B4" font-size="14" font-weight="600" letter-spacing="0.03em">우테코 크루 서비스 카탈로그</text>

    <text x="76" y="274" fill="#FFFFFF" font-size="48" font-weight="760" letter-spacing="-0.065em">크루들이 만든 서비스를</text>
    <text x="76" y="332" fill="#FFFFFF" font-size="48" font-weight="760" letter-spacing="-0.065em">한곳에서 모아보세요</text>
    <rect x="78" y="355" width="162" height="5" rx="2.5" fill="url(#blueGlow)"/>

    <text x="80" y="412" fill="#D1D7E0" font-size="18" font-weight="450" letter-spacing="-0.04em">서비스를 공유하고, 크루들의 프로젝트를 찾아보세요.</text>

    <g filter="url(#softShadow)" transform="translate(78 500)">
      <rect width="207" height="52" rx="26" fill="#2D8CFF"/>
      <text x="25" y="33" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="-0.04em">서비스 둘러보기</text>
      <path d="M171 26h12m0 0-5-5m5 5-5 5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="80" y="594" fill="#778193" font-size="11" font-weight="600" letter-spacing="0.16em">DROPIT / CREW SERVICE CATALOG</text>
  </g>
</svg>
